<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>FIX Menkao2</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, writeBatch, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyC-V7h2Uve6FUSY2sBo7Rq-a3O0Qbm0W0o",
  authDomain: "bateke-v4.firebaseapp.com",
  projectId: "bateke-v4",
  storageBucket: "bateke-v4.appspot.com",
  messagingSenderId: "YOUR_ID",
  appId: "YOUR_APP_ID"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.importer = async (e)=>{
  const file = e.target.files[0];
  const text = await file.text();
  let data;
  try{
    data = JSON.parse(text);
    if(!Array.isArray(data)) data = data.stock || data.produits || [];
  }catch{
    const wb = XLSX.read(text,{type:'binary'});
    // si excel
    const wb2 = XLSX.read(await file.arrayBuffer());
    const sheet = wb2.Sheets[wb2.SheetNames[0]];
    data = XLSX.utils.sheet_to_json(sheet);
  }
  console.log("Lignes trouvées:", data.length);
  const batch = writeBatch(db);
  let count=0;
  data.forEach((p,i)=>{
    // Nettoyage style V3 - tolérant
    const docRef = doc(collection(db, "shops", "Menkao2", "stock"));
    const clean = {
      designation: (p.designation || p.Designation || p.Nom || p.nom || "Produit "+i).toString().trim(),
      quantite: parseInt(p.quantite || p.Quantite || p.stock || p.qte || 0),
      prix_achat: parseFloat(p.prix_achat || p.PrixAchat || p.achat || 0),
      prix_vente: parseFloat(p.prix_vente || p.PrixVente || p.vente || p.prix || 0),
      categorie: (p.categorie || "General").toString()
    };
    batch.set(docRef, clean);
    count++;
    if(count%400==0){ batch.commit(); }
  });
  await batch.commit();
  alert(count+" produits importés dans Menkao2! Maintenant va voir patron_v4.html");
}
</script>
</head>
<body style="font-family:Arial;text-align:center;padding:40px">
<h2>Réparation Menkao2 - Mode V3 tolérant</h2>
<p>Choisis ton fichier Menkao2 qui ne passe pas (JSON ou Excel) :</p>
<input type="file" onchange="importer(event)">
<p>Ouvre la console F12 pour voir les logs</p>
</body></html>
