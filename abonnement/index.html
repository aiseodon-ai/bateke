<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BATEKE - Abonnement 15.000 FC</title><base href="/bateke/">
<style>body{background:#0a0a0a;color:#fff;font-family:Inter;padding:16px}.card{background:#171717;border:1px solid #262626;border-radius:18px;padding:20px;margin:12px 0}.price{font-size:42px;font-weight:900;color:#22c55e}.btn{width:100%;padding:16px;border-radius:14px;border:0;font-weight:900;font-size:16px;cursor:pointer;margin:6px 0}.btn-airtel{background:#ff0000;color:#fff}.btn-mpesa{background:#1ab759;color:#fff}input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;margin:8px 0;box-sizing:border-box}</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head><body>
<h1>🔒 Abonnement BATEKE</h1>
<div class="card"><div class="price">15.000 FC <span style="font-size:14px;color:#888">/ mois / <span id="shopLabel">boutique</span></span></div><div id="bloqueInfo" style="color:#ef4444;margin-top:8px"></div></div>
<div class="card"><h3>1. Choisis</h3><button class="btn btn-airtel" onclick="selectPay('AIRTEL','0998111387')">AIRTEL MONEY - 0998111387</button><button class="btn btn-mpesa" onclick="selectPay('MPESA','0816640963')">M-PESA - 0816640963</button><div id="payInstr" style="display:none;background:#111;padding:12px;border-radius:12px;margin-top:10px"></div></div>
<div class="card"><h3>2. Confirme (après envoi)</h3><input id="shopName" placeholder="Nom boutique"><input id="txId" placeholder="ID Transaction (ex: PP240... ou 1234567890)"><input id="phonePayer" placeholder="Ton numéro qui a payé"><button class="btn" style="background:#7c3aed;color:#fff" onclick="submitPay()">J'AI PAYÉ - ENVOYER AU DG</button><div id="status"></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBOD42Ibg7tGVafz44cwCyI0CUjgAn5MNY",authDomain:"bateke-v4.firebaseapp.com",databaseURL:"https://bateke-v4-default-rtdb.firebaseio.com",projectId:"bateke-v4",storageBucket:"bateke-v4.firebasestorage.app",messagingSenderId:"321333206282",appId:"1:321333206282:web:6d1603446be3d195de6ef3"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
firebase.auth().signInAnonymously();
const db=firebase.database();
let selected={reseau:'',numero:''};
const params=new URLSearchParams(location.search);
let boutiqueParam=params.get('boutique')||'';
let patronParam=params.get('patron')||'';
let expireParam=params.get('expire')||'';
document.getElementById('shopName').value=boutiqueParam;
document.getElementById('shopLabel').innerText=boutiqueParam||'boutique';
if(expireParam){ let j=Math.ceil((Date.now()-Number(expireParam))/86400000); document.getElementById('bloqueInfo').innerHTML=`⛔ Boutique <b>${boutiqueParam}</b> bloquée depuis ${j}j - Patron ${patronParam}`; }
function selectPay(r,n){ selected={reseau:r,numero:n}; let d=document.getElementById('payInstr'); d.style.display='block'; d.innerHTML=`✅ <b>${r}</b> → Envoie <b>15.000 FC</b> au <b>${n}</b><br>1. Ouvre ${r==='AIRTEL'?'*501#':'*1122#'}<br>2. Garde le SMS avec l'ID`; }
function submitPay(){
 const shop=document.getElementById('shopName').value.trim().replace(/[^a-zA-Z0-9]/g,''); const tx=document.getElementById('txId').value.trim().toUpperCase(); const phone=document.getElementById('phonePayer').value.trim();
 if(!shop||!tx||!phone||!selected.reseau) return alert('Remplis tout + choisis réseau');
 if(tx.length<6) return alert('ID Transaction trop court');
 document.getElementById('status').innerHTML='⏳ Vérification doublon...';
 // Anti-doublon TX ID
 db.ref('paiements_abonnements').orderByChild('transactionId').equalTo(tx).once('value').then(s=>{
  if(s.exists()){ document.getElementById('status').innerHTML='<span style="color:#ef4444">❌ Cet ID a déjà été utilisé</span>'; return; }
  const data={boutique:shop,patronId:patronParam||'',transactionId:tx,phonePayer:phone,reseau:selected.reseau,numeroDG:selected.numero,montant:15000,statut:'en_attente',date:Date.now(),dateISO:new Date().toISOString()};
  db.ref('paiements_abonnements').push(data).then(()=>{
   db.ref('abonnements_demandes/'+shop).set(data);
   document.getElementById('status').innerHTML=`<b style="color:#22c55e">✅ Demande envoyée DG!</b><br>ID <b>${tx}</b> pour <b>${shop}</b><br>Le DG va vérifier Airtel/Mpesa et activer en 2 min.<br><br><a href="https://wa.me/243998111387?text=DG%20j'ai%20pay%C3%A9%2015000FC%20pour%20${shop}%20TX:${tx}%20${selected.reseau}" style="color:#25D366">→ Prévenir DG sur WhatsApp</a>`;
  });
 });
}
</script></body></html>
