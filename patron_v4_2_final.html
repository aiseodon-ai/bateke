<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Patron V4.2 V4 PRO DG</title>
<style>
body{margin:0;font-family:Arial;background:#f0f2f5}header{background:#111;color:#fff;padding:10px;text-align:center;position:sticky;top:0;z-index:20}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px}.card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 6px rgba(0,0,0,.1);margin-bottom:8px}
.kpi{font-size:20px;font-weight:bold;color:#0b5e2f}.red{color:red}.tabs{display:flex;background:#fff;position:sticky;top:108px;z-index:10;overflow:auto;border-bottom:2px solid #eee}.tabs button{flex:1;padding:12px;border:none;font-weight:bold;white-space:nowrap}.tabs button.active{border-bottom:3px solid #0b5e2f;color:#0b5e2f}
.sec{display:none;padding:8px}.sec.active{display:block}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:7px;border:1px solid #ddd;text-align:left}th{background:#1e293b;color:#fff}
input,select{padding:8px;border-radius:6px;border:1px solid #ccc;width:100%;margin:3px 0;box-sizing:border-box}.btn{padding:9px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:2px;font-size:12px}.btn-g{background:#0b5e2f;color:#fff}.btn-y{background:#facc15}.btn-b{background:#0ea5e9;color:#fff}.btn-r{background:#ef4444;color:#fff}.editable{background:#fffde7;border:1px dashed #d4a017;cursor:pointer}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:99;align-items:center;justify-content:center}.modal.active{display:flex}.modalBox{background:#fff;padding:20px;border-radius:12px;width:90%;max-width:500px}
canvas{background:#fff;border-radius:8px;padding:10px;margin-top:10px}
@media print {.noPrint{display:none} }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body>
<header><h3 style="margin:0">👑 PATRON V4.2 V4 - DG PRO</h3><small id="live">● LIVE bateke-v4</small>
<div class="noPrint" style="margin-top:6px;display:flex;gap:5px;justify-content:center;flex-wrap:wrap">
<select id="shopSel" onchange="switchShop()" style="width:110px"><option>Menkao1</option><option>Menkao2</option><option>Mbakana</option><option value="ALL">TOUTES</option></select>
<input type="file" id="excelIn" accept=".xlsx,.xls" style="width:110px"><button class="btn btn-b" onclick="openNewArt()">+ Article</button><span id="importLog" style="color:#0f0;font-size:10px"></span>
</div></header>
<div class="grid noPrint"><div class="card">💰 CA Jour<br><span class="kpi" id="caJour">0</span><br><small id="caMois">Mois:0</small></div><div class="card">📈 Bénéfice Net<br><span class="kpi" id="benefJour">0</span><br><small id="benefMois">Mois:0</small></div><div class="card">🏦 À Verser<br><span class="kpi red" id="aVerser">0</span><br><small id="detailCaisse" style="font-size:10px"></small></div></div>
<div class="tabs noPrint"><button class="active" onclick="tab('ventes',this)">🔴 Live</button><button onclick="tab('stock',this)">📦 Stock</button><button onclick="tab('rapport',this)">📊 Rapport</button><button onclick="tab('crm',this)">👥 CRM</button><button onclick="tab('caisse',this)">💰 Caisse</button></div>

<div id="ventes" class="sec active"><div class="card"><h4>Ventes Live</h4><div id="ventesList"></div></div></div>
<div id="stock" class="sec"><div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:5px"><h4 style="margin:0">Stock EDIT</h4><div><button class="btn btn-y" onclick="pdfStockTotal()">📦 PDF Stock Total</button><button class="btn btn-r" onclick="pdfRequisition()">📋 PDF Réquisition (≤ seuil)</button></div></div>
<div style="display:flex;gap:5px;margin-top:8px"><input id="searchS" placeholder="CODE ou Nom..." oninput="renderStock()"><select id="roleSel" style="width:120px"><option value="patron">Patron</option><option value="assistant">Assistant</option></select></div>
<table><thead><tr><th>Code</th><th>Désignation</th><th>Qté</th><th>Seuil</th><th>PV</th><th>PA</th><th>Bénéf</th><th>Act</th></tr></thead><tbody id="stockT"></tbody></table></div></div>

<div id="rapport" class="sec"><div class="card"><h4>📊 RAPPORT DG + GRAPHIQUE</h4>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
Du: <input type="date" id="du">Au: <input type="date" id="au">
Type: <select id="typeRapport" onchange="onTypeChange()"><option value="ca">CA Global</option><option value="ventes">Ventes Détaillées</option><option value="benef">Bénéfice Net</option><option value="article">Vente par ARTICLE</option><option value="entrees">Entrées Stock</option><option value="entree_article">Entrée par ARTICLE</option><option value="depenses">Dépenses par TYPE</option><option value="invendus">Invendus</option><option value="top">Top Produits</option><option value="client">Par CLIENT</option></select>
<div id="filtreExtra"></div>
</div>
<div style="margin-top:8px"><button class="btn btn-g" onclick="genRapport()">Générer</button><button class="btn btn-y" onclick="pdfRapportOnly()">📄 PDF Rapport</button></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><canvas id="chartRapport" height="200"></canvas><canvas id="chartTop" height="200"></canvas></div>
<div id="printArea"><div id="rapportC" style="background:#fff;padding:10px;margin-top:10px;border-radius:8px;min-height:100px;border:1px solid #ddd;overflow:auto"></div></div>
</div></div>
<div id="crm" class="sec"><div class="card"><h4>CRM</h4><input id="searchCli" placeholder="Nom..." oninput="renderCRM()"><div id="crmList"></div></div></div>
<div id="caisse" class="sec"><div class="card"><h4>Journal Caisse</h4><div id="caisseList"></div></div></div>

<div id="modalArt" class="modal"><div class="modalBox"><h3>Nouvel Article</h3><input id="newCode" placeholder="CODE"><input id="newDes" placeholder="Désignation"><input id="newPV" type="number" placeholder="PV"><input id="newPA" type="number" placeholder="PA"><input id="newQte" type="number" placeholder="Qté"><input id="newSeuil" type="number" value="3"><div style="display:flex;gap:5px;margin-top:10px"><button class="btn btn-g" onclick="saveNewArt()">Créer</button><button class="btn" onclick="closeModal('modalArt')">Annuler</button></div></div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyB0D421bg7tGVafz44cwCyIOCUjgAn5MNY",authDomain:"bateke-v4.firebaseapp.com",databaseURL:"https://bateke-v4-default-rtdb.firebaseio.com",projectId:"bateke-v4",storageBucket:"bateke-v4.firebasestorage.app",messagingSenderId:"321333206282",appId:"1:321333206282:web:6d1603446be3d195de6ef3"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
let SHOP=localStorage.getItem('patron_shop')||'Menkao1';document.getElementById('shopSel').value=SHOP;
let ALL_DATA={Menkao1:{ventes:[],dep:[],vers:[],stock:[],entrees:[],clients:{}},Menkao2:{ventes:[],dep:[],vers:[],stock:[],entrees:[],clients:{}},Mbakana:{ventes:[],dep:[],vers:[],stock:[],entrees:[],clients:{}}};
document.getElementById('du').valueAsDate=new Date(new Date().setDate(1));document.getElementById('au').valueAsDate=new Date();
let chart1=null, chart2=null;
function switchShop(){SHOP=document.getElementById('shopSel').value;localStorage.setItem('patron_shop',SHOP);refreshAll();}
function tab(id,el){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));el.classList.add('active');}
function openNewArt(){document.getElementById('modalArt').classList.add('active')}function closeModal(id){document.getElementById(id).classList.remove('active')}

document.getElementById('excelIn').addEventListener('change',e=>{
 let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{
  try{let wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});let js=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);let c=0;
   js.forEach(row=>{let code=String(row.CODE||row.C0DE||'').trim();if(!code)return;let des=String(row.Designation||row.DESIGNATION||'').trim();let pv=parseFloat(String(row['Prix Unit']||row['Prix Unit ']||0).replace(/[^0-9.]/g,''))||0;let pa=parseFloat(String(row['Prix Achat']||pv*0.7).replace(/[^0-9.]/g,''))||Math.round(pv*0.7);let qte=parseInt(row.Quantite||0)||0;let seuil=parseInt(row.seuil||3)||3;db.ref('shops/'+SHOP+'/stock/'+code).set({CODE:code,Designation:des,'Prix Unit':pv,'Prix Achat':pa,Quantite:qte,seuil:seuil});c++;});
   document.getElementById('importLog').innerText='✅ '+c; }catch(err){alert(err.message);}
 };r.readAsArrayBuffer(f);
});
function listenShop(s){
 db.ref('shops/'+s+'/stock').on('value',snap=>{ALL_DATA[s].stock=snap.val()?Object.values(snap.val()):[];if(SHOP===s||SHOP==='ALL'){renderStock();updateKPIs();}});
 db.ref('shops/'+s+'/ventes').on('value',snap=>{ALL_DATA[s].ventes=Object.values(snap.val()||{});if(SHOP===s||SHOP==='ALL'){renderVentes();updateKPIs();}});
 db.ref('shops/'+s+'/depenses').on('value',snap=>{ALL_DATA[s].dep=Object.values(snap.val()||{});if(SHOP===s||SHOP==='ALL'){renderCaisse();updateKPIs();}});
 db.ref('shops/'+s+'/versements').on('value',snap=>{ALL_DATA[s].vers=Object.values(snap.val()||{});if(SHOP===s||SHOP==='ALL'){renderCaisse();updateKPIs();}});
 db.ref('shops/'+s+'/entrees').on('value',snap=>{ALL_DATA[s].entrees=Object.values(snap.val()||{});});
 db.ref('shops/'+s+'/clients').on('value',snap=>{ALL_DATA[s].clients=snap.val()||{};if(SHOP===s||SHOP==='ALL'){renderCRM();updateKPIs();}});
}
['Menkao1','Menkao2','Mbakana'].forEach(listenShop);
function getFiltered(){if(SHOP==='ALL')return{ventes:[...ALL_DATA.Menkao1.ventes,...ALL_DATA.Menkao2.ventes,...ALL_DATA.Mbakana.ventes],dep:[...ALL_DATA.Menkao1.dep,...ALL_DATA.Menkao2.dep,...ALL_DATA.Mbakana.dep],vers:[...ALL_DATA.Menkao1.vers,...ALL_DATA.Menkao2.vers,...ALL_DATA.Mbakana.vers],stock:[...ALL_DATA.Menkao1.stock,...ALL_DATA.Menkao2.stock,...ALL_DATA.Mbakana.stock],entrees:[...ALL_DATA.Menkao1.entrees,...ALL_DATA.Menkao2.entrees,...ALL_DATA.Mbakana.entrees],clients:{...ALL_DATA.Menkao1.clients,...ALL_DATA.Menkao2.clients,...ALL_DATA.Mbakana.clients}};else return ALL_DATA[SHOP];}
function updateKPIs(){let data=getFiltered();let today=new Date().toDateString();let vToday=data.ventes.filter(v=>new Date(v.date).toDateString()===today);let caJ=vToday.reduce((s,v)=>s+v.total,0);let benJ=vToday.reduce((s,v)=>s+(v.benefice||0),0);let depJ=data.dep.filter(d=>new Date(d.date).toDateString()===today).reduce((s,d)=>s+d.montant,0);document.getElementById('caJour').innerText=caJ.toLocaleString()+' FC';document.getElementById('benefJour').innerText=(benJ-depJ).toLocaleString()+' FC';document.getElementById('aVerser').innerText=(caJ-depJ-data.vers.filter(v=>new Date(v.date).toDateString()===today).reduce((s,v)=>s+v.montant,0)).toLocaleString()+' FC';}
function renderVentes(){let data=getFiltered();let v=data.ventes.sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,50);document.getElementById('ventesList').innerHTML=v.map(v=>`<div style="padding:6px;border-bottom:1px solid #eee"><b>${new Date(v.date).toLocaleString()}</b> - ${v.total?.toLocaleString()} FC - ${(v.items||[]).map(i=>i.qty+'x '+i.CODE+' '+i.Designation).join(', ')}</div>`).join('');}
function renderCaisse(){let data=getFiltered();let all=[...data.ventes.map(v=>({date:v.date,txt:`Vente ${v.boutique} ${v.total?.toLocaleString()} FC`})),...data.dep.map(d=>({date:d.date,txt:`Dépense [${d.motif}] ${d.montant?.toLocaleString()} FC`})),...data.vers.map(v=>({date:v.date,txt:`Versement ${v.montant?.toLocaleString()} FC`} ))].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,100);document.getElementById('caisseList').innerHTML=all.map(a=>`<div style="padding:5px;border-bottom:1px solid #eee">${new Date(a.date).toLocaleString()} - ${a.txt}</div>`).join('');}
function renderStock(){let data=getFiltered();let q=(document.getElementById('searchS').value||'').toLowerCase();let f=data.stock.filter(p=>(p.CODE||'').toLowerCase().includes(q)||(p.Designation||'').toLowerCase().includes(q)).slice(0,250);document.getElementById('stockT').innerHTML=f.map(p=>`<tr><td>${p.CODE}</td><td class="editable" onclick="editField('${p.CODE}','Designation','${(p.Designation||'').replace(/'/g,"\\'")}')">${p.Designation}</td><td class="editable" onclick="editField('${p.CODE}','Quantite',${p.Quantite})">${p.Quantite}</td><td class="editable" onclick="editField('${p.CODE}','seuil',${p.seuil||3})">${p.seuil||3}</td><td class="editable" onclick="editField('${p.CODE}','Prix Unit',${p['Prix Unit']})">${p['Prix Unit']}</td><td class="editable" onclick="editField('${p.CODE}','Prix Achat',${p['Prix Achat']})">${p['Prix Achat']}</td><td>${(p['Prix Unit']-p['Prix Achat']).toLocaleString()}</td><td><button onclick="entree('${p.CODE}')">+</button> <button onclick="supp('${p.CODE}')" style="background:red;color:white;border:none;border-radius:4px">X</button></td></tr>`).join('');}
function editField(code,field,oldVal){let nv=prompt('Nouvelle valeur '+field+' pour '+code+' (actuel '+oldVal+')?');if(nv===null)return;let val=field==='Designation'?nv:Number(nv);let target=SHOP==='ALL'?prompt('Boutique?'):SHOP;if(!target)return;db.ref('shops/'+target+'/stock/'+code).update({[field]:val});}
function entree(code){let qty=parseInt(prompt('Qté entrée pour '+code+'?'));if(!qty)return;let s=SHOP==='ALL'?prompt('Boutique?'):SHOP;if(!s)return;db.ref('shops/'+s+'/stock/'+code).once('value').then(snap=>{let p=snap.val();if(p){let des=p.Designation||p.CODE; db.ref('shops/'+s+'/stock/'+code).update({Quantite:p.Quantite+qty}); db.ref('shops/'+s+'/entrees/'+Date.now()).set({date:new Date().toISOString(),CODE:code,Designation:des,qty:qty,qtyAvant:p.Quantite,qtyApres:p.Quantite+qty,boutique:s}); alert('Entrée OK: ['+code+'] '+des+' +'+qty);}});}
function supp(code){if(!confirm('Supprimer '+code+'?'))return;let s=SHOP==='ALL'?prompt('Boutique?'):SHOP;db.ref('shops/'+s+'/stock/'+code).remove();}
function saveNewArt(){let code=document.getElementById('newCode').value.trim();if(!code)return;let des=document.getElementById('newDes').value;let pv=Number(document.getElementById('newPV').value)||0;let pa=Number(document.getElementById('newPA').value)||Math.round(pv*0.7);let qte=Number(document.getElementById('newQte').value)||0;let seuil=Number(document.getElementById('newSeuil').value)||3;let s=SHOP==='ALL'?prompt('Boutique cible?'):SHOP;if(!s)return;db.ref('shops/'+s+'/stock/'+code).set({CODE:code,Designation:des,'Prix Unit':pv,'Prix Achat':pa,Quantite:qte,seuil:seuil});closeModal('modalArt');}
function renderCRM(){let data=getFiltered();let q=(document.getElementById('searchCli').value||'').toLowerCase();let clis=Object.values(data.clients).filter(c=>(c.nom||'').toLowerCase().includes(q)).slice(0,100);document.getElementById('crmList').innerHTML=clis.map(c=>`<div style="padding:6px;border-bottom:1px solid #eee"><b>${c.nom}</b> ${c.tel||''} - Total:${(c.totalAchat||0).toLocaleString()}</div>`).join('');}
function onTypeChange(){let t=document.getElementById('typeRapport').value;let extra=document.getElementById('filtreExtra');if(t==='article'||t==='entree_article'||t==='ventes')extra.innerHTML=`<input id="fCode" placeholder="CODE ex: AC001 (vide=tous)">`;else if(t==='depenses')extra.innerHTML=`<select id="fDep"><option value="">Tous</option><option>ration</option><option>transport</option><option>achat stock</option><option>loyer</option><option>electricite</option><option>credit</option><option>autre</option></select>`;else if(t==='client')extra.innerHTML=`<input id="fClient" placeholder="Nom client">`;else extra.innerHTML='';}

function genRapport(){
 let data=getFiltered();let du=new Date(document.getElementById('du').value);let au=new Date(document.getElementById('au').value);au.setHours(23,59,59);let type=document.getElementById('typeRapport').value;
 let vPeriode=data.ventes.filter(v=>{let d=new Date(v.date);return d>=du&&d<=au;});let depPeriode=data.dep.filter(d=>{let dt=new Date(d.date);return dt>=du&&dt<=au;});let entPeriode=data.entrees.filter(e=>{let dt=new Date(e.date);return dt>=du&&dt<=au;});
 let html='';let chartData={labels:[],values:[],label:''};

 if(type==='ca'){let ca=vPeriode.reduce((s,v)=>s+v.total,0);html=`<h3>CA Global ${SHOP} - Du ${du.toLocaleDateString()} au ${au.toLocaleDateString()}</h3><table><tr><th>Date</th><th>Boutique</th><th>Client</th><th>Total</th><th>Bénéf</th><th>Détails</th></tr>`+vPeriode.map(v=>`<tr><td>${new Date(v.date).toLocaleString()}</td><td>${v.boutique||''}</td><td>${v.client?.nom||'Comptoir'}</td><td>${v.total?.toLocaleString()}</td><td>${(v.benefice||0).toLocaleString()}</td><td>${(v.items||[]).map(i=>i.qty+'x ['+i.CODE+'] '+i.Designation).join(', ')}</td></tr>`).join('')+`</table><p><b>Total CA: ${ca.toLocaleString()} FC - ${vPeriode.length} ventes</b></p>`;
  chartData={labels:vPeriode.slice(0,20).map(v=>new Date(v.date).toLocaleDateString()),values:vPeriode.slice(0,20).map(v=>v.total),label:'CA par vente'};
 }
 if(type==='ventes'){let code=(document.getElementById('fCode')?.value||'').toUpperCase();let list=code?vPeriode.filter(v=>(v.items||[]).some(i=>i.CODE===code)):vPeriode;html=`<h3>Ventes Détaillées ${code||'Toutes'} - ${list.length} ventes</h3><table><tr><th>Date</th><th>Boutique</th><th>Client</th><th>CODE</th><th>Désignation</th><th>Qté</th><th>PV</th><th>Total</th><th>Payement</th></tr>`+list.flatMap(v=>(v.items||[]).filter(i=>!code||i.CODE===code).map(i=>`<tr><td>${new Date(v.date).toLocaleString()}</td><td>${v.boutique}</td><td>${v.client?.nom||''}</td><td>${i.CODE}</td><td>${i.Designation}</td><td>${i.qty}</td><td>${i.Prix}</td><td>${(i.qty*i.Prix).toLocaleString()}</td><td>${v.payement||''}</td></tr>`)).join('')+'</table>';}
 if(type==='article'){let code=(document.getElementById('fCode')?.value||'').toUpperCase();if(!code)return alert('Entre CODE ex AC001');let hist=[];vPeriode.forEach(v=>{(v.items||[]).forEach(i=>{if(i.CODE===code)hist.push({date:v.date,CODE:i.CODE,Designation:i.Designation,qty:i.qty,prix:i.Prix,total:i.qty*i.Prix,client:v.client?.nom||'',boutique:v.boutique});});});html=`<h3>Historique Vente [${code}] ${hist[0]?.Designation||''} - Qté:${hist.reduce((s,h)=>s+h.qty,0)} CA:${hist.reduce((s,h)=>s+h.total,0).toLocaleString()} FC</h3><table><tr><th>Date</th><th>Boutique</th><th>CODE</th><th>Désignation</th><th>Qté</th><th>PV</th><th>Total</th><th>Client</th></tr>`+hist.map(h=>`<tr><td>${new Date(h.date).toLocaleString()}</td><td>${h.boutique}</td><td>${h.CODE}</td><td>${h.Designation}</td><td>${h.qty}</td><td>${h.prix}</td><td>${h.total.toLocaleString()}</td><td>${h.client}</td></tr>`).join('')+'</table>';
  chartData={labels:hist.map(h=>new Date(h.date).toLocaleDateString()),values:hist.map(h=>h.qty),label:'Qté vendue '+code};
 }
 if(type==='entrees'){html=`<h3>Entrées Stock - ${entPeriode.length} opérations</h3><table><tr><th>Date</th><th>Boutique</th><th>CODE</th><th>Désignation</th><th>Qté Entrée</th><th>Avant</th><th>Après</th></tr>`+entPeriode.map(e=>`<tr><td>${new Date(e.date).toLocaleString()}</td><td>${e.boutique||''}</td><td>${e.CODE}</td><td>${e.Designation||e.CODE}</td><td>+${e.qty}</td><td>${e.qtyAvant??''}</td><td>${e.qtyApres??''}</td></tr>`).join('')+'</table>';}
 if(type==='entree_article'){let code=(document.getElementById('fCode')?.value||'').toUpperCase();if(!code)return alert('CODE obligatoire');let hist=entPeriode.filter(e=>e.CODE===code);html=`<h3>Historique Entrées [${code}] ${hist[0]?.Designation||''} - ${hist.length} entrées - Total +${hist.reduce((s,h)=>s+h.qty,0)}</h3><table><tr><th>Date</th><th>Boutique</th><th>CODE</th><th>Désignation</th><th>Qté</th></tr>`+hist.map(e=>`<tr><td>${new Date(e.date).toLocaleString()}</td><td>${e.boutique}</td><td>${e.CODE}</td><td>${e.Designation||e.CODE}</td><td>+${e.qty}</td></tr>`).join('')+'</table>';}
 if(type==='depenses'){let fDep=document.getElementById('fDep')?.value||'';let depF=fDep?depPeriode.filter(d=>(d.motif||'').toLowerCase().includes(fDep.toLowerCase())):depPeriode;html=`<h3>Dépenses ${fDep||'Toutes'}: ${depF.reduce((s,d)=>s+d.montant,0).toLocaleString()} FC</h3><table><tr><th>Date</th><th>Boutique</th><th>Type</th><th>Montant</th><th>Description</th></tr>`+depF.map(d=>`<tr><td>${new Date(d.date).toLocaleString()}</td><td>${d.boutique}</td><td>${d.motif}</td><td>${d.montant.toLocaleString()}</td><td>${d.description||''}</td></tr>`).join('')+'</table>';
  chartData={labels:[...new Set(depF.map(d=>d.motif))],values:[...new Set(depF.map(d=>d.motif))].map(m=>depF.filter(d=>d.motif===m).reduce((s,d)=>s+d.montant,0)),label:'Dépenses par type'};
 }
 if(type==='benef'){let ca=vPeriode.reduce((s,v)=>s+v.total,0);let benBrut=vPeriode.reduce((s,v)=>s+(v.benefice||0),0);let dep=depPeriode.reduce((s,d)=>s+d.montant,0);html=`<h3>Bénéfice Net - Du ${du.toLocaleDateString()} au ${au.toLocaleDateString()}</h3><table><tr><th>CA</th><th>Bénéf Brut</th><th>Dépenses</th><th>Bénéf Net</th><th>Marge</th></tr><tr><td>${ca.toLocaleString()}</td><td>${benBrut.toLocaleString()}</td><td>${dep.toLocaleString()}</td><td style="font-weight:bold;color:green">${(benBrut-dep).toLocaleString()} FC</td><td>${ca?((benBrut-dep)/ca*100).toFixed(1):0}%</td></tr></table>`;chartData={labels:['CA','Bénéf Brut','Dépenses','Net'],values:[ca,benBrut,dep,benBrut-dep],label:'Analyse Bénéfice'};}

function pdfRapportOnly(){let content=document.getElementById('rapportC').innerHTML;let w=window.open('','','width=900,height=900');w.document.write('<html><head><title>Rapport</title><style>body{font-family:Arial;font-size:11px;padding:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:6px}th{background:#111;color:#fff}</style></head><body>'+content+'<br><small>Imprimé '+new Date().toLocaleString()+' - '+SHOP+'</small></body></html>');w.document.close();w.print();}
function pdfStockTotal(){let data=getFiltered();let stock=data.stock.sort((a,b)=>a.CODE.localeCompare(b.CODE));let html=`<h2>STOCK TOTAL - ${SHOP} - ${new Date().toLocaleDateString()}</h2><p>${stock.length} articles - Valeur PV: ${stock.reduce((s,p)=>s+p['Prix Unit']*p.Quantite,0).toLocaleString()} FC</p><table border=1 cellpadding=5 cellspacing=0 style="width:100%;border-collapse:collapse;font-size:11px"><tr><th>CODE</th><th>Désignation</th><th>Qté</th><th>Seuil</th><th>PV</th><th>PA</th><th>Valeur PV</th></tr>`+stock.map(p=>`<tr><td>${p.CODE}</td><td>${p.Designation}</td><td>${p.Quantite}</td><td>${p.seuil}</td><td>${p['Prix Unit'].toLocaleString()}</td><td>${p['Prix Achat'].toLocaleString()}</td><td>${(p['Prix Unit']*p.Quantite).toLocaleString()}</td></tr>`).join('')+'</table>';let w=window.open('','','width=1000,height=900');w.document.write('<html><head><title>Stock Total</title></head><body>'+html+'</body></html>');w.document.close();w.print();}
function pdfRequisition(){let data=getFiltered();let low=data.stock.filter(p=>p.Quantite<= (p.seuil||3)).sort((a,b)=>a.Quantite-b.Quantite);let html=`<h2>📋 REQUISITION REAPPRO - ${SHOP} - ${new Date().toLocaleDateString()}</h2><p>Articles en rupture ou sous seuil (${low.length} articles)</p><table border=1 cellpadding=6 cellspacing=0 style="width:100%;border-collapse:collapse;font-size:12px"><tr><th>CODE</th><th>Désignation</th><th>Qté Actuelle</th><th>Seuil</th><th>Manque</th><th>Qté à Commander</th><th>PV</th></tr>`+low.map(p=>{let manque=(p.seuil||3)-p.Quantite;let aCmd=Math.max((p.seuil||3)*3,10);return `<tr style="${p.Quantite<=0?'background:#fecaca':''}"><td>${p.CODE}</td><td>${p.Designation}</td><td style="font-weight:bold;color:red">${p.Quantite}</td><td>${p.seuil}</td><td>${manque>0?manque:0}</td><td style="background:#fffde7"><b>${aCmd}</b></td><td>${p['Prix Unit'].toLocaleString()}</td></tr>`}).join('')+'</table><p>Total valeur à commander: ${low.reduce((s,p)=>s+p['Prix Achat']*Math.max((p.seuil||3)*3,10),0).toLocaleString()} FC (estimation achat)</p>';let w=window.open('','','width=1000,height=900');w.document.write('<html><head><title>Réquisition</title></head><body>'+html+'<br><small>Demande générée le '+new Date().toLocaleString()+' - Boutique: '+SHOP+'</small></body></html>');w.document.close();w.print();}
