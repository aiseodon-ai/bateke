<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Patron V4.2 V4.4</title>
<style>
body{margin:0;font-family:Arial;background:#f0f2f5}header{background:#111;color:#fff;padding:10px;text-align:center;position:sticky;top:0;z-index:30}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px}.card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 6px rgba(0,0,0,.1);margin-bottom:8px}
.kpi{font-size:18px;font-weight:bold;color:#0b5e2f}.red{color:red}
.tabs{display:flex;background:#fff;position:sticky;top:85px;z-index:20;overflow-x:auto;border-bottom:2px solid #eee}.tabs button{flex:1;min-width:80px;padding:12px;border:none;background:#fff;font-weight:bold;cursor:pointer}.tabs button.active{border-bottom:3px solid #0b5e2f;color:#0b5e2f;background:#f0fdf4}
.sec{display:none;padding:8px}.sec.active{display:block}
.subtabs{display:flex;gap:5px;margin:8px 0}.subtabs button{padding:8px 12px;border:1px solid #0b5e2f;border-radius:20px;background:#fff;cursor:pointer}.subtabs button.active{background:#0b5e2f;color:#fff}
table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:6px;border:1px solid #ddd;text-align:left}th{background:#1e293b;color:#fff}tr:nth-child(even){background:#f8fafc}
input,select{padding:8px;border-radius:6px;border:1px solid #ccc;width:100%;margin:3px 0;box-sizing:border-box}
.btn{padding:8px 12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:2px;font-size:12px}.btn-g{background:#0b5e2f;color:#fff}.btn-y{background:#facc15}.btn-b{background:#0ea5e9;color:#fff}.btn-r{background:#ef4444;color:#fff}.editable{background:#fffde7;cursor:pointer}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:99;align-items:center;justify-content:center}.modal.active{display:flex}.modalBox{background:#fff;padding:20px;border-radius:12px;width:90%;max-width:500px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body>
<header><h3 style="margin:0">👑 PATRON V4.2 V4.4 DG</h3><small>● FIX Synthèse + Ventes</small>
<div style="margin-top:6px;display:flex;gap:5px;justify-content:center;flex-wrap:wrap">
<select id="shopSel" onchange="switchShop()" style="width:110px"><option>Menkao1</option><option>Menkao2</option><option>Mbakana</option><option value="ALL">TOUTES</option></select>
<input type="file" id="excelIn" accept=".xlsx,.xls" style="width:110px"><button class="btn btn-b" onclick="openNewArt()">+ Article</button>
</div></header>
<div class="grid"><div class="card">💰 CA Jour<br><span class="kpi" id="caJour">0</span></div><div class="card">📈 Bénéf Net<br><span class="kpi" id="benefJour">0</span></div><div class="card">🏦 À Verser<br><span class="kpi red" id="aVerser">0</span></div></div>
<div class="tabs"><button id="btn-ventes" class="active" onclick="switchTab('ventes')">🔴 Ventes</button><button id="btn-stock" onclick="switchTab('stock')">📦 Stock</button><button id="btn-rapport" onclick="switchTab('rapport')">📊 Rapport</button><button id="btn-crm" onclick="switchTab('crm')">👥 CRM</button><button id="btn-caisse" onclick="switchTab('caisse')">💰 Caisse</button></div>

<div id="ventes" class="sec active"><div class="card"><h4>🔴 Ventes Live</h4><div style="overflow:auto"><table><thead><tr><th>Date</th><th>CODE</th><th>Désignation</th><th>Qté</th><th>Total</th><th>Client</th></tr></thead><tbody id="ventesList"></tbody></table></div></div></div>
<div id="stock" class="sec"><div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap"><h4>📦 Stock</h4><div><button class="btn btn-y" onclick="pdfStockTotal()">📦 PDF Stock</button><button class="btn btn-r" onclick="pdfRequisition()">📋 Réquisition</button></div></div><input id="searchS" placeholder="CODE ou Nom ex: acide" oninput="renderStock()"><div style="overflow:auto"><table><thead><tr><th>Code</th><th>Désignation</th><th>Qté</th><th>Seuil</th><th>PV</th><th>PA</th><th>Bénéf</th><th>Act</th></tr></thead><tbody id="stockT"></tbody></table></div></div></div>

<div id="rapport" class="sec"><div class="card"><h4>📊 Rapport DG</h4>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">Du: <input type="date" id="du">Au: <input type="date" id="au">
Type: <select id="typeRapport" onchange="onTypeChange()">
<option value="synthese">⭐ SYNTHESE PERIODE COMPLETE</option>
<option value="synthese_ventes">⭐ SYNTHESE VENTES / SORTIES par Article</option>
<option value="synthese_entrees">⭐ SYNTHESE ENTREES par Article</option>
<option value="synthese_depenses">⭐ SYNTHESE DEPENSES par Type</option>
<option value="ca">CA Global (détaillé)</option>
<option value="ventes">Ventes Détaillées</option>
<option value="benef">Bénéfice Net</option>
<option value="article">Vente par ARTICLE</option>
<option value="entrees">Entrées Stock (liste)</option>
<option value="entree_article">Entrée par ARTICLE</option>
<option value="depenses">Dépenses Liste</option>
<option value="top">Top Produits</option>
<option value="invendus">Invendus</option>
</select>
<div id="filtreExtra"></div></div>
<div style="margin-top:8px"><button class="btn btn-g" onclick="genRapport()">Générer Tableau</button><button class="btn btn-y" onclick="pdfRapportOnly()">📄 PDF</button></div>
<div class="subtabs"><button id="sub-table" class="active" onclick="switchSub('table')">📋 Tableau</button><button id="sub-graph" onclick="switchSub('graph')">📈 Graphique</button></div>
<div id="vue-table"><div id="rapportC" style="background:#fff;padding:8px;border:1px solid #ddd;border-radius:8px;overflow:auto"></div></div>
<div id="vue-graph" style="display:none"><select id="graphType" onchange="genGraph()"><option value="ca">CA</option><option value="ventes">Ventes Qté</option><option value="entrees">Entrées</option><option value="depenses">Dépenses</option><option value="top">Top</option></select><canvas id="chartRapport" height="250"></canvas></div>
</div></div>

<div id="crm" class="sec"><div class="card"><h4>👥 CRM</h4><input id="searchCli" placeholder="Nom..." oninput="renderCRM()"><div style="overflow:auto"><table><thead><tr><th>Nom</th><th>Tél</th><th>Total</th><th>Dette</th></tr></thead><tbody id="crmList"></tbody></table></div></div></div>
<div id="caisse" class="sec"><div class="card"><h4>💰 Caisse</h4><div style="overflow:auto"><table><thead><tr><th>Date</th><th>Type</th><th>Motif</th><th>Montant</th></tr></thead><tbody id="caisseList"></tbody></table></div></div></div>

<div id="modalArt" class="modal"><div class="modalBox"><h3>Nouvel Article</h3><input id="newCode" placeholder="CODE"><input id="newDes" placeholder="Désignation ex: Acide"><input id="newPV" type="number" placeholder="PV"><input id="newPA" type="number" placeholder="PA"><input id="newQte" type="number" placeholder="Qté"><input id="newSeuil" type="number" value="3"><div style="display:flex;gap:5px;margin-top:10px"><button class="btn btn-g" onclick="saveNewArt()">Créer</button><button class="btn" onclick="closeModal('modalArt')">Annuler</button></div></div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyB0D421bg7tGVafz44cwCyIOCUjgAn5MNY",authDomain:"bateke-v4.firebaseapp.com",databaseURL:"https://bateke-v4-default-rtdb.firebaseio.com",projectId:"bateke-v4",storageBucket:"bateke-v4.firebasestorage.app",messagingSenderId:"321333206282",appId:"1:321333206282:web:6d1603446be3d195de6ef3"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
let SHOP=localStorage.getItem('patron_shop')||'Menkao1';document.getElementById('shopSel').value=SHOP;
let ALL_DATA={Menkao1:{ventes:[],dep:[],vers:[],stock:[],entrees:[],clients:{}},Menkao2:{ventes:[],dep:[],vers:[],stock:[],entrees:[],clients:{}},Mbakana:{ventes:[],dep:[],vers:[],stock:[],entrees:[],clients:{}}};
document.getElementById('du').valueAsDate=new Date(new Date().setDate(1));document.getElementById('au').valueAsDate=new Date();
let chart1=null;
function switchShop(){SHOP=document.getElementById('shopSel').value;localStorage.setItem('patron_shop',SHOP);refreshAll();}
function switchTab(id){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+id).classList.add('active');}
function switchSub(id){document.getElementById('vue-table').style.display=id==='table'?'block':'none';document.getElementById('vue-graph').style.display=id==='graph'?'block':'none';document.getElementById('sub-table').classList.toggle('active',id==='table');document.getElementById('sub-graph').classList.toggle('active',id==='graph'); if(id==='graph')genGraph();}
function openNewArt(){document.getElementById('modalArt').classList.add('active')}function closeModal(id){document.getElementById(id).classList.remove('active')}
document.getElementById('excelIn').addEventListener('change',e=>{
 let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{
  try{let wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});let js=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);let c=0;
   js.forEach(row=>{let code=String(row.CODE||'').trim();if(!code)return;let des=String(row.Designation||'').trim();let pv=parseFloat(String(row['Prix Unit']||0).replace(/[^0-9.]/g,''))||0;let pa=parseFloat(String(row['Prix Achat']||pv*0.7).replace(/[^0-9.]/g,''))||Math.round(pv*0.7);let qte=parseInt(row.Quantite||0)||0;let seuil=parseInt(row.seuil||3)||3;db.ref('shops/'+SHOP+'/stock/'+code).set({CODE:code,Designation:des,'Prix Unit':pv,'Prix Achat':pa,Quantite:qte,seuil:seuil});c++;});alert(c+' importés');}catch(err){alert(err.message);}
 };r.readAsArrayBuffer(f);
});
function listenShop(s){
 db.ref('shops/'+s+'/stock').on('value',snap=>{ALL_DATA[s].stock=snap.val()?Object.values(snap.val()):[];if(SHOP===s||SHOP==='ALL'){renderStock();updateKPIs();}});
 db.ref('shops/'+s+'/ventes').on('value',snap=>{ALL_DATA[s].ventes=Object.values(snap.val()||{});if(SHOP===s||SHOP==='ALL'){renderVentes();updateKPIs();}});
 db.ref('shops/'+s+'/depenses').on('value',snap=>{ALL_DATA[s].dep=Object.values(snap.val()||{});if(SHOP===s||SHOP==='ALL'){renderCaisse();updateKPIs();}});
 db.ref('shops/'+s+'/versements').on('value',snap=>{ALL_DATA[s].vers=Object.values(snap.val()||{});if(SHOP===s||SHOP==='ALL'){renderCaisse();updateKPIs();}});
 db.ref('shops/'+s+'/entrees').on('value',snap=>{ALL_DATA[s].entrees=Object.values(snap.val()||{});});
 db.ref('shops/'+s+'/clients').on('value',snap=>{ALL_DATA[s].clients=snap.val()||{};if(SHOP===s||SHOP==='ALL'){renderCRM();updateKPIs();}});
}
['Menkao1','Menkao2','Mbakana'].forEach(listenShop);
function getFiltered(){if(SHOP==='ALL')return{ventes:[...ALL_DATA.Menkao1.ventes,...ALL_DATA.Menkao2.ventes,...ALL_DATA.Mbakana.ventes],dep:[...ALL_DATA.Menkao1.dep,...ALL_DATA.Menkao2.dep,...ALL_DATA.Mbakana.dep],vers:[...ALL_DATA.Menkao1.vers,...ALL_DATA.Menkao2.vers,...ALL_DATA.Mbakana.vers],stock:[...ALL_DATA.Menkao1.stock,...ALL_DATA.Menkao2.stock,...ALL_DATA.Mbakana.stock],entrees:[...ALL_DATA.Menkao1.entrees,...ALL_DATA.Menkao2.entrees,...ALL_DATA.Mbakana.entrees],clients:{...ALL_DATA.Menkao1.clients,...ALL_DATA.Menkao2.clients,...ALL_DATA.Mbakana.clients}};else return ALL_DATA[SHOP];}
function getStockMap(){let data=getFiltered();let map={};let mapPA={};data.stock.forEach(p=>{map[p.CODE]=p.Designation;mapPA[p.CODE]=p;});return {nameMap:map,fullMap:mapPA};}
function updateKPIs(){let data=getFiltered();let today=new Date().toDateString();let vToday=data.ventes.filter(v=>new Date(v.date).toDateString()===today);let caJ=vToday.reduce((s,v)=>s+v.total,0);let benJ=vToday.reduce((s,v)=>s+(v.benefice||0),0);let depJ=data.dep.filter(d=>new Date(d.date).toDateString()===today).reduce((s,d)=>s+d.montant,0);document.getElementById('caJour').innerText=caJ.toLocaleString()+' FC';document.getElementById('benefJour').innerText=(benJ-depJ).toLocaleString()+' FC';document.getElementById('aVerser').innerText=(caJ-depJ-data.vers.filter(v=>new Date(v.date).toDateString()===today).reduce((s,v)=>s+v.montant,0)).toLocaleString()+' FC';}
function renderVentes(){let data=getFiltered();let rows=[];data.ventes.sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,100).forEach(v=>{(v.items||[]).forEach(i=>{rows.push(`<tr><td>${new Date(v.date).toLocaleString()}</td><td>${i.CODE}</td><td>${i.Designation}</td><td>${i.qty}</td><td>${(i.qty*i.Prix).toLocaleString()}</td><td>${v.client?.nom||'Comptoir'}</td></tr>`);});});document.getElementById('ventesList').innerHTML=rows.join('')||'<tr><td colspan=6>Aucune</td></tr>';}
function renderCaisse(){let data=getFiltered();let all=[];data.ventes.forEach(v=>all.push({date:v.date,type:'Vente',motif:(v.items||[]).map(i=>i.CODE).join(','),montant:v.total}));data.dep.forEach(d=>all.push({date:d.date,type:'Dépense',motif:d.motif||'',montant:-d.montant}));all.sort((a,b)=>new Date(b.date)-new Date(a.date));document.getElementById('caisseList').innerHTML=all.slice(0,100).map(a=>`<tr><td>${new Date(a.date).toLocaleString()}</td><td>${a.type}</td><td>${a.motif}</td><td style="color:${a.montant<0?'red':'green'}">${a.montant.toLocaleString()}</td></tr>`).join('');}
function renderStock(){let data=getFiltered();let q=(document.getElementById('searchS').value||'').toLowerCase();let f=data.stock.filter(p=>(p.CODE||'').toLowerCase().includes(q)||(p.Designation||'').toLowerCase().includes(q)).slice(0,250);document.getElementById('stockT').innerHTML=f.map(p=>`<tr><td>${p.CODE}</td><td class="editable" onclick="editField('${p.CODE}','Designation','${(p.Designation||'').replace(/'/g,"\\'")}')">${p.Designation}</td><td class="editable" onclick="editField('${p.CODE}','Quantite',${p.Quantite})">${p.Quantite}</td><td>${p.seuil||3}</td><td>${p['Prix Unit']?.toLocaleString()}</td><td>${p['Prix Achat']?.toLocaleString()}</td><td>${(p['Prix Unit']-p['Prix Achat']).toLocaleString()}</td><td><button onclick="entree('${p.CODE}')">+</button></td></tr>`).join('');}
function renderCRM(){let data=getFiltered();let q=(document.getElementById('searchCli').value||'').toLowerCase();let clis=Object.values(data.clients).filter(c=>(c.nom||'').toLowerCase().includes(q));document.getElementById('crmList').innerHTML=clis.map(c=>`<tr><td>${c.nom}</td><td>${c.tel||''}</td><td>${(c.totalAchat||0).toLocaleString()}</td><td>${(c.dette||0).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan=4>Aucun</td></tr>';}
function editField(code,field,oldVal){let nv=prompt('Nouvelle valeur '+field+'?');if(nv===null)return;let val=field==='Designation'?nv:Number(nv);let target=SHOP==='ALL'?prompt('Boutique?'):SHOP;if(!target)return;db.ref('shops/'+target+'/stock/'+code).update({[field]:val});}
function entree(code){let qty=parseInt(prompt('Qté entrée '+code+'?'));if(!qty)return;let s=SHOP==='ALL'?prompt('Boutique?'):SHOP;if(!s)return;db.ref('shops/'+s+'/stock/'+code).once('value').then(snap=>{let p=snap.val();if(p){db.ref('shops/'+s+'/stock/'+code).update({Quantite:p.Quantite+qty});db.ref('shops/'+s+'/entrees/'+Date.now()).set({date:new Date().toISOString(),CODE:code,Designation:p.Designation||code,boutique:s,qty:qty});}});}
function saveNewArt(){let code=document.getElementById('newCode').value.trim();if(!code)return;let des=document.getElementById('newDes').value;let pv=Number(document.getElementById('newPV').value)||0;let pa=Number(document.getElementById('newPA').value)||Math.round(pv*0.7);let qte=Number(document.getElementById('newQte').value)||0;let seuil=Number(document.getElementById('newSeuil').value)||3;let s=SHOP==='ALL'?prompt('Boutique cible?'):SHOP;if(!s)return;db.ref('shops/'+s+'/stock/'+code).set({CODE:code,Designation:des,'Prix Unit':pv,'Prix Achat':pa,Quantite:qte,seuil:seuil});closeModal('modalArt');}
function onTypeChange(){let t=document.getElementById('typeRapport').value;let extra=document.getElementById('filtreExtra');if(t==='article'||t==='entree_article')extra.innerHTML=`<input id="fCode" placeholder="CODE">`;else if(t==='depenses')extra.innerHTML=`<select id="fDep"><option value="">Tous</option><option>ration</option><option>transport</option><option>achat stock</option><option>loyer</option><option>electricite</option><option>credit</option></select>`;else extra.innerHTML='';}

function genRapport(){
 let data=getFiltered();let {nameMap, fullMap}=getStockMap();let du=new Date(document.getElementById('du').value);let au=new Date(document.getElementById('au').value);au.setHours(23,59,59);
 let type=document.getElementById('typeRapport').value;let vPeriode=data.ventes.filter(v=>{let d=new Date(v.date);return d>=du&&d<=au;});let depPeriode=data.dep.filter(d=>{let dt=new Date(d.date);return dt>=du&&dt<=au;});let entPeriode=data.entrees.filter(e=>{let dt=new Date(e.date);return dt>=du&&dt<=au;});
 let html='';
 if(type==='synthese'){
  let ca=vPeriode.reduce((s,v)=>s+v.total,0);let ben=vPeriode.reduce((s,v)=>s+(v.benefice||0),0);let dep=depPeriode.reduce((s,d)=>s+d.montant,0);let qteV=vPeriode.reduce((s,v)=>s+(v.items||[]).reduce((a,i)=>a+i.qty,0),0);let qteE=entPeriode.reduce((s,e)=>s+e.qty,0);
  html=`<h3>⭐ SYNTHESE PERIODE ${SHOP} - ${du.toLocaleDateString()} au ${au.toLocaleDateString()}</h3>
  <table><tr><th>Indicateur</th><th>Valeur</th><th>Détail</th></tr>
  <tr><td>CA</td><td><b>${ca.toLocaleString()} FC</b></td><td>${vPeriode.length} ventes / ${qteV} articles</td></tr>
  <tr><td>Bénéf Brut</td><td>${ben.toLocaleString()} FC</td><td>${ca?((ben/ca)*100).toFixed(1):0}% marge</td></tr>
  <tr><td>Dépenses</td><td style="color:red">${dep.toLocaleString()} FC</td><td>${depPeriode.length} ops</td></tr>
  <tr><td>Bénéf Net</td><td style="color:green;font-weight:bold">${(ben-dep).toLocaleString()} FC</td><td>Brut - dépenses</td></tr>
  <tr><td>Entrées</td><td>+${qteE}</td><td>${entPeriode.length} réappros</td></tr>
  </table>`;
 }
 if(type==='synthese_ventes'){
  // GROUP BY ARTICLE
  let byArt={};
  vPeriode.forEach(v=>{
    (v.items||[]).forEach(i=>{
      if(!byArt[i.CODE]) byArt[i.CODE]={CODE:i.CODE,Designation:nameMap[i.CODE]||i.Designation||i.CODE,qty:0,ca:0,benef:0};
      byArt[i.CODE].qty+=i.qty;
      byArt[i.CODE].ca+=i.qty*i.Prix;
      byArt[i.CODE].benef+= i.qty*((i.Prix||0)-(fullMap[i.CODE]?.['Prix Achat']||0));
    });
  });
  let totalQte=Object.values(byArt).reduce((s,a)=>s+a.qty,0);
  let totalCA=Object.values(byArt).reduce((s,a)=>s+a.ca,0);
  let totalBenef=Object.values(byArt).reduce((s,a)=>s+a.benef,0);
  let rows=Object.values(byArt).sort((a,b)=>b.qty-a.qty).map(r=>{
    let stockRest=fullMap[r.CODE]?.Quantite?? '';
    return `<tr><td>${r.CODE}</td><td><b>${r.Designation}</b></td><td>${r.qty}</td><td>${r.ca.toLocaleString()} FC</td><td>${r.benef.toLocaleString()} FC</td><td>${stockRest}</td></tr>`;
  }).join('');
  html=`<h3>⭐ SYNTHESE VENTES / SORTIES - ${du.toLocaleDateString()} au ${au.toLocaleDateString()} - ${SHOP}</h3>
  <p>Total articles sortis: <b>${totalQte}</b> - CA Période: <b>${totalCA.toLocaleString()} FC</b> - Bénéfice estimé: <b>${totalBenef.toLocaleString()} FC</b></p>
  <table><tr><th>CODE</th><th>Désignation (Nom réel)</th><th>Qté Sortie</th><th>CA</th><th>Bénéf</th><th>Stock Actuel</th></tr>${rows}</table>`;
 }
 if(type==='synthese_entrees'){
  let byArt={};entPeriode.forEach(e=>{if(!byArt[e.CODE])byArt[e.CODE]={CODE:e.CODE,Designation:nameMap[e.CODE]||e.Designation||e.CODE,qty:0,nb:0};byArt[e.CODE].qty+=e.qty;byArt[e.CODE].nb++;});
  let totalQte=Object.values(byArt).reduce((s,a)=>s+a.qty,0);
  html=`<h3>⭐ SYNTHESE ENTREES par Article - Total +${totalQte}</h3><table><tr><th>CODE</th><th>Désignation</th><th>Nb Entrées</th><th>Qté Totale Entrée</th></tr>`+Object.values(byArt).sort((a,b)=>b.qty-a.qty).map(r=>`<tr><td>${r.CODE}</td><td><b>${r.Designation}</b></td><td>${r.nb}</td><td>+${r.qty}</td></tr>`).join('')+'</table>';
 }
 if(type==='synthese_depenses'){
  let byMot={};depPeriode.forEach(d=>{byMot[d.motif]=(byMot[d.motif]||0)+d.montant;});
  let totalDep=depPeriode.reduce((s,d)=>s+d.montant,0);
  let rows=Object.entries(byMot).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${k}</td><td>${v.toLocaleString()} FC</td><td>${totalDep? (v/totalDep*100).toFixed(1):0}%</td></tr>`).join('');
  html=`<h3>⭐ SYNTHESE DEPENSES par Type - Du ${du.toLocaleDateString()} au ${au.toLocaleDateString()}</h3><table><tr><th>Type</th><th>Total</th><th>%</th></tr>${rows}</table><p><b>Total: ${totalDep.toLocaleString()} FC - ${depPeriode.length} opérations</b></p>`;
 }
 if(type==='entrees'){
  html=`<h3>Entrées Stock - ${entPeriode.length} ops</h3><table><tr><th>Date</th><th>CODE</th><th>Désignation</th><th>Qté</th></tr>`+entPeriode.map(e=>`<tr><td>${new Date(e.date).toLocaleString()}</td><td>${e.CODE}</td><td><b>${nameMap[e.CODE]||e.Designation||e.CODE}</b></td><td>+${e.qty}</td></tr>`).join('')+'</table>';
 }
 if(type==='entree_article'){let code=(document.getElementById('fCode')?.value||'').toUpperCase();if(!code)return alert('CODE');let hist=entPeriode.filter(e=>e.CODE===code);let realName=nameMap[code]||hist[0]?.Designation||code;html=`<h3>Entrées [${code}] ${realName} - Total +${hist.reduce((s,h)=>s+h.qty,0)}</h3><table><tr><th>Date</th><th>CODE</th><th>Désignation</th><th>Qté</th></tr>`+hist.map(e=>`<tr><td>${new Date(e.date).toLocaleString()}</td><td>${e.CODE}</td><td>${realName}</td><td>+${e.qty}</td></tr>`).join('')+'</table>';}
 if(type==='ca'){let ca=vPeriode.reduce((s,v)=>s+v.total,0);html=`<h3>CA ${ca.toLocaleString()} FC - ${vPeriode.length} ventes</h3><table><tr><th>Date</th><th>Détails</th><th>Total</th></tr>`+vPeriode.map(v=>`<tr><td>${new Date(v.date).toLocaleString()}</td><td>${(v.items||[]).map(i=>`[${i.CODE}] ${nameMap[i.CODE]||i.Designation} x${i.qty}`).join(', ')}</td><td>${v.total.toLocaleString()}</td></tr>`).join('')+'</table>';}
 if(type==='ventes'){let code=(document.getElementById('fCode')?.value||'').toUpperCase();let rows=[];vPeriode.forEach(v=>{(v.items||[]).filter(i=>!code||i.CODE===code).forEach(i=>{rows.push(`<tr><td>${new Date(v.date).toLocaleString()}</td><td>${i.CODE}</td><td>${nameMap[i.CODE]||i.Designation}</td><td>${i.qty}</td><td>${(i.qty*i.Prix).toLocaleString()}</td></tr>`);});});html=`<h3>Ventes ${code||'Toutes'}</h3><table><tr><th>Date</th><th>CODE</th><th>Désignation</th><th>Qté</th><th>Total</th></tr>`+rows.join('')+'</table>';}
 if(type==='article'){let code=(document.getElementById('fCode')?.value||'').toUpperCase();if(!code)return alert('CODE');let realName=nameMap[code]||code;let rows=[];vPeriode.forEach(v=>{(v.items||[]).forEach(i=>{if(i.CODE===code)rows.push(`<tr><td>${new Date(v.date).toLocaleString()}</td><td>${i.CODE}</td><td>${realName}</td><td>${i.qty}</td><td>${(i.qty*i.Prix).toLocaleString()}</td></tr>`);});});html=`<h3>Vente [${code}] ${realName}</h3><table><tr><th>Date</th><th>CODE</th><th>Désignation</th><th>Qté</th><th>Total</th></tr>`+rows.join('')+'</table>';}
 if(type==='depenses'){let fDep=document.getElementById('fDep')?.value||'';let depF=fDep?depPeriode.filter(d=>(d.motif||'').toLowerCase().includes(fDep.toLowerCase())):depPeriode;html=`<h3>Dépenses ${depF.reduce((s,d)=>s+d.montant,0).toLocaleString()} FC</h3><table><tr><th>Date</th><th>Type</th><th>Montant</th></tr>`+depF.map(d=>`<tr><td>${new Date(d.date).toLocaleString()}</td><td>${d.motif}</td><td>${d.montant.toLocaleString()}</td></tr>`).join('')+'</table>';}
 document.getElementById('rapportC').innerHTML=html;switchSub('table');
}
function genGraph(){let data=getFiltered();let du=new Date(document.getElementById('du').value);let au=new Date(document.getElementById('au').value);au.setHours(23,59,59);let type=document.getElementById('graphType').value;let vPeriode=data.ventes.filter(v=>{let d=new Date(v.date);return d>=du&&d<=au;});let depPeriode=data.dep.filter(d=>{let dt=new Date(d.date);return dt>=du&&dt<=au;});let entPeriode=data.entrees.filter(e=>{let dt=new Date(e.date);return dt>=du&&dt<=au;});let labels=[],values=[],label='',gtype='bar';if(type==='ca'){let byDay={};vPeriode.forEach(v=>{let day=new Date(v.date).toLocaleDateString();byDay[day]=(byDay[day]||0)+v.total;});labels=Object.keys(byDay);values=Object.values(byDay);label='CA par jour';}if(type==='entrees'){let byDay={};entPeriode.forEach(e=>{let day=new Date(e.date).toLocaleDateString();byDay[day]=(byDay[day]||0)+e.qty;});labels=Object.keys(byDay);values=Object.values(byDay);label='Entrées par jour';}if(type==='depenses'){let byMot={};depPeriode.forEach(d=>{byMot[d.motif]=(byMot[d.motif]||0)+d.montant;});labels=Object.keys(byMot);values=Object.values(byMot);label='Dépenses';gtype='pie';}if(type==='top'){let map={};vPeriode.forEach(v=>{(v.items||[]).forEach(i=>{map[i.CODE]=(map[i.CODE]||0)+i.qty;});});let sorted=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,10);let {nameMap}=getStockMap();labels=sorted.map(s=>s[0]+' '+(nameMap[s[0]]||'').slice(0,10));values=sorted.map(s=>s[1]);label='Top 10';gtype='pie';}if(chart1)chart1.destroy();chart1=new Chart(document.getElementById('chartRapport'),{type:gtype,data:{labels:labels,datasets:[{label:label,data:values,backgroundColor:gtype==='pie'?['#0b5e2f','#0ea5e9','#facc15','#ef4444','#22c55e']: '#0b5e2f'}]},options:{responsive:true,plugins:{title:{display:true,text:label}}}});}
function pdfRapportOnly(){let content=document.getElementById('rapportC').innerHTML;let w=window.open('','','width=900,height=900');w.document.write('<html><head><style>table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:6px}th{background:#111;color:#fff}</style></head><body>'+content+'</body></html>');w.document.close();w.print();}
function pdfStockTotal(){let data=getFiltered();let stock=data.stock.sort((a,b)=>a.CODE.localeCompare(b.CODE));let html=`<h2>STOCK TOTAL ${SHOP} ${new Date().toLocaleDateString()}</h2><table border=1 cellpadding=5 style="width:100%;border-collapse:collapse;font-size:11px"><tr><th>CODE</th><th>Désignation</th><th>Qté</th><th>PV</th></tr>`+stock.map(p=>`<tr><td>${p.CODE}</td><td>${p.Designation}</td><td>${p.Quantite}</td><td>${p['Prix Unit']}</td></tr>`).join('')+'</table>';let w=window.open('','','width=1000,height=900');w.document.write('<html><body>'+html+'</body></html>');w.document.close();w.print();}
function pdfRequisition(){let data=getFiltered();let low=data.stock.filter(p=>p.Quantite<= (p.seuil||3));let html=`<h2>REQUISITION ${SHOP}</h2><table border=1 cellpadding=6 style="width:100%;border-collapse:collapse"><tr><th>CODE</th><th>Désignation</th><th>Qté</th><th>Seuil</th><th>À Cmd</th></tr>`+low.map(p=>`<tr><td>${p.CODE}</td><td>${p.Designation}</td><td style="color:red">${p.Quantite}</td><td>${p.seuil}</td><td><b>${Math.max((p.seuil||3)*3,10)}</b></td></tr>`).join('')+'</table>';let w=window.open('','','width=1000,height=900');w.document.write('<html><body>'+html+'</body></html>');w.document.close();w.print();}
