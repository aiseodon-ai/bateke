<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Patron V4 DG</title><style>body{margin:0;font-family:Arial;background:#f0f2f5}header{background:#111;color:#fff;padding:12px;text-align:center;position:sticky;top:0;z-index:10}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px}.card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 6px rgba(0,0,0,.1)}.kpi{font-size:22px;font-weight:bold;color:#0b5e2f}.red{color:red}.tabs{display:flex;background:#fff;position:sticky;top:55px;z-index:5;overflow:auto}.tabs button{flex:1;padding:12px;border:none;font-weight:bold}.tabs button.active{border-bottom:3px solid #0b5e2f;color:#0b5e2f}.sec{display:none;padding:8px}.sec.active{display:block}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:6px;border-bottom:1px solid #eee}input,select{padding:8px;border-radius:6px;border:1px solid #ccc;width:100%;margin:3px 0}.btn{padding:10px;border:none;border-radius:8px;font-weight:bold;width:100%;margin-top:5px}.btn-g{background:#0b5e2f;color:#fff}</style><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body><header><h3>👑 PATRON V4 LIVE + CRM</h3><small id="live">● LIVE connecté</small><div style="margin-top:6px">Boutique: <select id="shopSel" onchange="switchShop()"><option>Menkao1</option><option>Menkao2</option><option>Mbakana</option><option value="ALL">TOUTES</option></select> <input type="file" id="excelIn" accept=".xlsx" style="width:160px"></div></header><div class="grid"><div class="card">💰 CA Jour<br><span class="kpi" id="caJour">0 FC</span><br><small id="caMois">Mois: 0</small></div><div class="card">📈 Bénéfice Réel<br><span class="kpi" id="benefJour">0</span><br><small id="benefMois">Mois: 0</small></div><div class="card">🏦 À Verser<br><span class="kpi red" id="aVerser">0</span><br><small id="detailCaisse">-</small></div></div><div class="grid"><div class="card">⚠️ Seuil<br><b id="alertCount">0</b><div id="alertMini" style="font-size:11px"></div></div><div class="card">💤 Dormants<br><b id="dormantCount">0</b><br><small id="dormantVal">0 FC</small></div><div class="card">👥 CRM<br><b id="clientCount">0</b><br><small id="creditCount">Crédits: 0</small></div></div><div class="tabs"><button class="active" onclick="tab('ventes',this)">🔴 Live</button><button onclick="tab('caisse',this)">💰 Caisse</button><button onclick="tab('top',this)">🏆 Top</button><button onclick="tab('crm',this)">👥 CRM</button><button onclick="tab('stock',this)">📦 Stock</button><button onclick="tab('rapport',this)">📊 Rapport</button></div><div id="ventes" class="sec active"><div class="card"><h4>Ventes Live Aujourd'hui</h4><div id="ventesList"></div></div></div><div id="caisse" class="sec"><div class="card"><h4>Journal Caisse</h4><div id="caisseList"></div></div></div><div id="top" class="sec"><div class="card"><h4>Top 10 (30j)</h4><div id="topList"></div></div><div class="card"><h4>Flop 10 Dormants</h4><div id="flopList"></div></div></div><div id="crm" class="sec"><div class="card"><input id="searchCli" placeholder="Chercher client..." oninput="renderCRM()"><div id="crmList"></div></div></div><div id="stock" class="sec"><div class="card"><h4>Stock & Entrées</h4><div style="display:flex;gap:5px"><input id="searchS" placeholder="Chercher..." oninput="renderStock()"></div><table><thead><tr><th>Code</th><th>Desig</th><th>Qte</th><th>PV</th><th>PA</th><th>Benef</th><th>+</th></tr></thead><tbody id="stockT"></tbody></table></div></div><div id="rapport" class="sec"><div class="card"><h4>Rapport DG</h4><button class="btn btn-g" onclick="genRapport()">Générer Rapport</button><div id="rapportC"></div></div></div><script>const firebaseConfig={apiKey:"AIzaSyB0D421bg7tGVafz44cwCyIOCUjgAn5MNY",authDomain:"bateke-v4.firebaseapp.com",databaseURL:"https://bateke-v4-default-rtdb.firebaseio.com",projectId:"bateke-v4",storageBucket:"bateke-v4.firebasestorage.app",messagingSenderId:"321333206282",appId:"1:321333206282:web:6d1603446be3d195de6ef3"};firebase.initializeApp(firebaseConfig);const db=firebase.database();let SHOP=localStorage.getItem('patron_shop')||'Menkao1';document.getElementById('shopSel').value=SHOP;let PRODUCTS={},ALL_DATA={Menkao1:{ventes:[],dep:[],vers:[],stock:[],clients:{}},Menkao2:{ventes:[],dep:[],vers:[],stock:[],clients:{}},Mbakana:{ventes:[],dep:[],vers:[],stock:[],clients:{}}};function switchShop(){SHOP=document.getElementById('shopSel').value;localStorage.setItem('patron_shop',SHOP);refreshAll();}function tab(id,el){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));el.classList.add('active');}document.getElementById('excelIn').addEventListener('change',e=>{let f=e.target.files[0];let r=new FileReader();r.onload=ev=>{let data=new Uint8Array(ev.target.result);let wb=XLSX.read(data,{type:'array'});let sh=wb.Sheets[wb.SheetNames[0]];let js=XLSX.utils.sheet_to_json(sh);js.forEach(row=>{let code=String(row.CODE||'');if(!code)return;db.ref('shops/'+SHOP+'/stock/'+code).set({CODE:code,Designation:row.Designation||'', 'Prix Unit':Number(row['Prix Unit']||0), 'Prix Achat':Number(row['Prix Achat']||0), Quantite:Number(row.Quantite||0), seuil:Number(row.seuil||5)});});alert('Stock '+SHOP+' importé LIVE!');};r.readAsArrayBuffer(f);});function listenShop(s){db.ref('shops/'+s+'/stock').on('value',snap=>{PRODUCTS[s]=snap.val()?Object.values(snap.val()):[];ALL_DATA[s].stock=PRODUCTS[s];if(SHOP===s||SHOP==='ALL'){renderStock();updateKPIs();}});db.ref('shops/'+s+'/ventes').on('value',snap=>{ALL_DATA[s].ventes=Object.values(snap.val()||{});if(SHOP===s||SHOP==='ALL'){renderVentes();updateKPIs();renderTop();}});db.ref('shops/'+s+'/depenses').on('value',snap=>{ALL_DATA[s].dep=Object.values(snap.val()||{});if(SHOP===s||SHOP==='ALL'){renderCaisse();updateKPIs();}});db.ref('shops/'+s+'/versements').on('value',snap=>{ALL_DATA[s].vers=Object.values(snap.val()||{});if(SHOP===s||SHOP==='ALL'){renderCaisse();updateKPIs();}});db.ref('shops/'+s+'/clients').on('value',snap=>{ALL_DATA[s].clients=snap.val()||{};if(SHOP===s||SHOP==='ALL')renderCRM();});}['Menkao1','Menkao2','Mbakana'].forEach(listenShop);function getFiltered(){if(SHOP==='ALL')return{ventes:[...ALL_DATA.Menkao1.ventes,...ALL_DATA.Menkao2.ventes,...ALL_DATA.Mbakana.ventes],dep:[...ALL_DATA.Menkao1.dep,...ALL_DATA.Menkao2.dep,...ALL_DATA.Mbakana.dep],vers:[...ALL_DATA.Menkao1.vers,...ALL_DATA.Menkao2.vers,...ALL_DATA.Mbakana.vers],stock:[...ALL_DATA.Menkao1.stock,...ALL_DATA.Menkao2.stock,...ALL_DATA.Mbakana.stock],clients:{...ALL_DATA.Menkao1.clients,...ALL_DATA.Menkao2.clients,...ALL_DATA.Mbakana.clients}};else return ALL_DATA[SHOP];}function updateKPIs(){let data=getFiltered();let today=new Date().toDateString();let vToday=data.ventes.filter(v=>new Date(v.date).toDateString()===today);let vMonth=data.ventes.filter(v=>new Date(v.date).getMonth()===new Date().getMonth());let caJ=vToday.reduce((s,v)=>s+v.total,0);let caM=vMonth.reduce((s,v)=>s+v.total,0);let benJ=vToday.reduce((s,v)=>s+(v.benefice||0),0);let benM=vMonth.reduce((s,v)=>s+(v.benefice||0),0);let depJ=data.dep.filter(d=>new Date(d.date).toDateString()===today).reduce((s,d)=>s+d.montant,0);let versJ=data.vers.filter(v=>new Date(v.date).toDateString()===today).reduce((s,v)=>s+v.montant,0);let aVerser=caJ-depJ-versJ;document.getElementById('caJour').innerText=caJ.toLocaleString()+' FC';document.getElementById('caMois').innerText='Mois: '+caM.toLocaleString();document.getElementById('benefJour').innerText=(benJ-depJ).toLocaleString()+' FC';document.getElementById('benefMois').innerText='Mois: '+(benM-data.dep.filter(d=>new Date(d.date).getMonth()===new Date().getMonth()).reduce((s,d)=>s+d.montant,0)).toLocaleString();document.getElementById('aVerser').innerText=aVerser.toLocaleString()+' FC';let det=['Menkao1','Menkao2','Mbakana'].map(s=>{let vd=ALL_DATA[s].ventes.filter(v=>new Date(v.date).toDateString()===today).reduce((a,v)=>a+v.total,0);let dp=ALL_DATA[s].dep.filter(d=>new Date(d.date).toDateString()===today).reduce((a,d)=>a+d.montant,0);let vs=ALL_DATA[s].vers.filter(v=>new Date(v.date).toDateString()===today).reduce((a,v)=>a+v.montant,0);return `${s}:${(vd-dp-vs).toLocaleString()}`;}).join(' | ');document.getElementById('detailCaisse').innerText=det;let low=data.stock.filter(p=>p.Quantite<=(p.seuil||5));document.getElementById('alertCount').innerText=low.length+' produits';document.getElementById('alertMini').innerHTML=low.slice(0,5).map(p=>`🔴 ${p.CODE}`).join('<br>');let soldCodes=new Set(data.ventes.filter(v=>new Date(v.date)>=new Date(Date.now()-30*86400000)).flatMap(v=>v.items.map(i=>i.CODE)));let dorm=data.stock.filter(p=>!soldCodes.has(p.CODE));document.getElementById('dormantCount').innerText=dorm.length;document.getElementById('dormantVal').innerText=dorm.reduce((s,p)=>s+p['Prix Unit']*p.Quantite,0).toLocaleString()+' FC';let clis=Object.values(data.clients);document.getElementById('clientCount').innerText=clis.length+' clients';let credit=data.ventes.filter(v=>v.payement==='credit').reduce((s,v)=>s+v.total,0);document.getElementById('creditCount').innerText='Crédits: '+credit.toLocaleString()+' FC';}function renderVentes(){let data=getFiltered();let v=data.ventes.sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,50);document.getElementById('ventesList').innerHTML=v.map(v=>`<div style="padding:6px;border-bottom:1px solid #eee"><b>${new Date(v.date).toLocaleTimeString()} - ${v.boutique}</b> - ${v.client.nom} - ${v.total.toLocaleString()} - Benef ${(v.benefice||0).toLocaleString()} - ${v.payement}<br><small>${v.items.map(i=>i.qty+'x'+i.Designation).join(', ')}</small></div>`).join('');}function renderCaisse(){let data=getFiltered();let all=[...data.ventes.map(v=>({date:v.date,txt:`Vente ${v.boutique} - ${v.client.nom} - ${v.total.toLocaleString()}`})),...data.dep.map(d=>({date:d.date,txt:`Dépense ${d.boutique} - ${d.motif} - ${d.montant.toLocaleString()}`})),...data.vers.map(v=>({date:v.date,txt:`Versement ${v.boutique} - ${v.montant.toLocaleString()}`}))].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,100);document.getElementById('caisseList').innerHTML=all.map(a=>`<div style="padding:5px;border-bottom:1px solid #eee">${new Date(a.date).toLocaleString()} - ${a.txt}</div>`).join('');}function renderTop(){let data=getFiltered();let map={};data.ventes.forEach(v=>{v.items.forEach(i=>{if(!map[i.CODE])map[i.CODE]={CODE:i.CODE,Designation:i.Designation,qty:0,ca:0,benef:0};map[i.CODE].qty+=i.qty;map[i.CODE].ca+=i.Prix*i.qty;map[i.CODE].benef+=(i.Prix-i.Achat)*i.qty;});});let top=Object.values(map).sort((a,b)=>b.qty-a.qty).slice(0,10);document.getElementById('topList').innerHTML=top.map((p,i)=>`<div>${i+1}. ${p.Designation} - ${p.qty} - CA ${p.ca.toLocaleString()} - Benef ${p.benef.toLocaleString()}</div>`).join('');let sold=new Set(data.ventes.filter(v=>new Date(v.date)>=new Date(Date.now()-30*86400000)).flatMap(v=>v.items.map(i=>i.CODE)));let flop=data.stock.filter(p=>!sold.has(p.CODE)).slice(0,10);document.getElementById('flopList').innerHTML=flop.map(p=>`<div>💤 ${p.Designation} - Stock ${p.Quantite} - ${(p['Prix Unit']*p.Quantite).toLocaleString()} FC</div>`).join('');}function renderStock(){let data=getFiltered();let q=(document.getElementById('searchS').value||'').toLowerCase();let f=data.stock.filter(p=>(p.Designation||'').toLowerCase().includes(q)).slice(0,150);document.getElementById('stockT').innerHTML=f.map(p=>`<tr><td>${p.CODE}</td><td>${p.Designation}</td><td>${p.Quantite}</td><td>${p['Prix Unit']}</td><td>${p['Prix Achat']}</td><td>${(p['Prix Unit']-p['Prix Achat']).toLocaleString()}</td><td><button onclick="entree('${p.CODE}')">+Entrée</button></td></tr>`).join('');}function renderCRM(){let data=getFiltered();let q=(document.getElementById('searchCli').value||'').toLowerCase();let clis=Object.values(data.clients).filter(c=>(c.tel||'').includes(q)||(c.nom||'').toLowerCase().includes(q)).sort((a,b)=>b.totalAchat-a.totalAchat).slice(0,100);document.getElementById('crmList').innerHTML=clis.map(c=>`<div style="padding:6px;border-bottom:1px solid #eee"><b>${c.nom} - ${c.tel}</b> ${c.quartier||''}<br>Visites:${c.nbVisites} Total:${(c.totalAchat||0).toLocaleString()} Pts:${c.points||0}</div>`).join('');}function entree(code){let qty=parseInt(prompt('Qté entrée pour '+code+'?'));if(!qty)return;let s=SHOP==='ALL'?prompt('Boutique? Menkao1/Menkao2/Mbakana'):SHOP;if(!s)return;db.ref('shops/'+s+'/stock/'+code).once('value').then(snap=>{let p=snap.val();if(p){db.ref('shops/'+s+'/stock/'+code).update({Quantite:p.Quantite+qty});db.ref('shops/'+s+'/entrees/'+Date.now()).set({date:new Date().toISOString(),CODE:code,qty});alert('Entrée OK');}});}function genRapport(){let data=getFiltered();let today=new Date().toDateString();let vToday=data.ventes.filter(v=>new Date(v.date).toDateString()===today);let ca=vToday.reduce((s,v)=>s+v.total,0);let ben=vToday.reduce((s,v)=>s+(v.benefice||0),0);let dep=data.dep.filter(d=>new Date(d.date).toDateString()===today).reduce((s,d)=>s+d.montant,0);let vers=data.vers.filter(v=>new Date(v.date).toDateString()===today).reduce((s,v)=>s+v.montant,0);document.getElementById('rapportC').innerHTML=`<p><b>Rapport ${new Date().toLocaleDateString()} - ${SHOP}</b><br>CA: ${ca.toLocaleString()}<br>Bénéfice brut: ${ben.toLocaleString()}<br>Dépenses: ${dep.toLocaleString()}<br>Net: ${(ben-dep).toLocaleString()} FC<br>Versé: ${vers.toLocaleString()}<br>Reste: ${(ca-dep-vers).toLocaleString()}<br>Nb ventes: ${vToday.length}</p>`;}function refreshAll(){updateKPIs();renderVentes();renderCaisse();renderTop();renderCRM();renderStock();}</script></body></html>
