<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vendeur V3.1</title>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f5f5f5}header{background:#0b5e2f;color:white;padding:10px;position:sticky;top:0;z-index:10}.badge{background:#FFD700;color:#000;padding:4px 10px;border-radius:20px;font-weight:bold}.product{background:white;margin:6px 10px;padding:10px;border-radius:10px;display:flex;justify-content:space-between;box-shadow:0 1px 2px rgba(0,0,0,.1)}.product.alert{border-left:5px solid red}.cart{position:fixed;bottom:0;left:0;right:0;background:#111;color:white;padding:10px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.box{background:white;width:100%;max-width:420px;border-radius:12px;padding:16px;max-height:90vh;overflow:auto}input,select{width:100%;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #ccc}.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:bold;margin-top:6px}.btn-green{background:#0b5e2f;color:white}</style></head><body>
<header><div style="display:flex;justify-content:space-between"><span id="shopBadge" class="badge">SHOP</span><b>BATEKE V3.1</b><span onclick="openStats()" style="background:white;color:#0b5e2f;padding:4px 8px;border-radius:8px;font-size:12px">📊</span></div><small id="info">Chargement...</small></header>
<div style="padding:6px 10px;display:flex;gap:6px"><input id="search" placeholder="Code ou nom..." oninput="render()" style="flex:1;padding:10px;border-radius:8px;border:1px solid #ccc"><button onclick="loadStock()" style="padding:10px;border-radius:8px">🔄</button></div>
<div id="list"></div><div style="height:200px"></div>
<div class="cart"><div style="display:flex;justify-content:space-between"><span id="cartC">0 art</span><b id="cartT">0 FC</b><input id="disc" type="number" placeholder="% remise max5" style="width:90px;padding:4px;border-radius:6px;border:none" oninput="updateCart()"></div><div id="cartI" style="font-size:11px;max-height:70px;overflow:auto"></div><button onclick="openCheckout()" style="width:100%;padding:12px;background:#25D366;border:none;border-radius:10px;font-weight:bold;color:white;margin-top:6px">VENDRE</button></div>
<div class="modal" id="checkoutM"><div class="box"><h3>Finaliser</h3><div id="det"></div><select id="cliType" onchange="document.getElementById('cliF').style.display=this.value==='anonyme'?'none':'block'"><option value="anonyme">Anonyme</option><option value="nouveau">Nouveau client</option></select><div id="cliF" style="display:none"><input id="cliNom" placeholder="Nom"><input id="cliPhone" placeholder="Tel"></div><select id="pay"><option value="paye">Payé</option><option value="credit">Crédit</option></select><button class="btn btn-green" onclick="valider()">CONFIRMER</button><button class="btn" style="background:#eee" onclick="closeM('checkoutM')">Annuler</button></div></div>
<div class="modal" id="statsM"><div class="box"><h3>Ventes <span id="shopName"></span></h3><button class="btn" style="background:#eee" onclick="filterS('jour')">Aujourd'hui</button><button class="btn" style="background:#eee" onclick="filterS('semaine')">Semaine</button><div id="statsL"></div><button class="btn btn-green" onclick="exportVentes()">📤 Exporter ventes pour patron (JSON)</button><button class="btn" style="background:#eee" onclick="closeM('statsM')">Fermer</button></div></div>
<script>
let SHOP=new URLSearchParams(location.search).get('shop')||localStorage.getItem('bateke_shop')||'Menkao1'; localStorage.setItem('bateke_shop',SHOP); document.getElementById('shopBadge').innerText=SHOP; document.getElementById('shopName').innerText=SHOP;
let PRODUCTS=[], CART=[], DISC=0, MAXD=5;
async function loadStock(){
 let file=`stock_${SHOP}.json`; document.getElementById('info').innerText='Chargement '+file+'...';
 try{ let r=await fetch('./'+file+'?v='+Date.now()); if(!r.ok) throw 'no'; PRODUCTS=await r.json(); localStorage.setItem('products_'+SHOP,JSON.stringify(PRODUCTS)); document.getElementById('info').innerText=PRODUCTS.length+' produits - '+SHOP+' - OK'; render(); }
 catch(e){ let s=localStorage.getItem('products_'+SHOP); if(s){PRODUCTS=JSON.parse(s); document.getElementById('info').innerText=PRODUCTS.length+' produits (cache) - clique 🔄'; render();} else document.getElementById('info').innerText='Aucun stock pour '+SHOP+'. Patron doit publier '+file; }
}
function render(){ let q=(document.getElementById('search').value||'').toLowerCase(); let f=PRODUCTS.filter(p=>(p.Designation||'').toLowerCase().includes(q)||(p.CODE||'').toLowerCase().includes(q)).slice(0,80);
 document.getElementById('list').innerHTML=f.map(p=>{let seuil=p.seuil||5; let isAlert=p.Quantite<=seuil; return `<div class="product ${isAlert?'alert':''}"><div style="flex:1"><b>${p.CODE}</b> ${p.Designation}<br><small>Stock: ${p.Quantite} ${isAlert?'🔴 SEUIL <'+seuil:''}</small><br><b style="color:#0b5e2f">${(p['Prix Unit']||0).toLocaleString()} FC</b></div><div><button onclick="add('${p.CODE}',-1)">-</button> <span id="q_${p.CODE}">${CART.find(c=>c.CODE===p.CODE)?.qty||0}</span> <button onclick="add('${p.CODE}',1)">+</button></div></div>`}).join('');}
function add(code,d){ let p=PRODUCTS.find(x=>x.CODE===code); let it=CART.find(c=>c.CODE===code); let cur=it?it.qty:0; let nxt=cur+d; if(d>0&&p.Quantite<=cur){alert('Stock '+SHOP+' insuffisant: '+p.Quantite);return;} if(nxt<=0) CART=CART.filter(c=>c.CODE!==code); else { if(it) it.qty=nxt; else CART.push({CODE:p.CODE,Designation:p.Designation,Prix:p['Prix Unit'],Achat:p['Prix Achat']||0,qty:1}); } document.getElementById('q_'+code)&&(document.getElementById('q_'+code).innerText=CART.find(c=>c.CODE===code)?.qty||0); updateCart();}
function updateCart(){ DISC=parseInt(document.getElementById('disc').value)||0; if(DISC>MAXD){DISC=MAXD; document.getElementById('disc').value=MAXD; alert('Max '+MAXD+'%');} let sub=CART.reduce((s,i)=>s+i.Prix*i.qty,0); let rem=Math.round(sub*DISC/100); let tot=sub-rem; document.getElementById('cartC').innerText=CART.reduce((s,i)=>s+i.qty,0)+' art'; document.getElementById('cartT').innerText=tot.toLocaleString()+' FC (-'+rem.toLocaleString()+')'; document.getElementById('cartI').innerHTML=CART.map(c=>`${c.qty}x ${c.Designation} <button onclick="add('${c.CODE}',-1)">-</button><button onclick="add('${c.CODE}',1)">+</button>`).join('<br>');}
function openCheckout(){ if(!CART.length){alert('Vide');return;} let sub=CART.reduce((s,i)=>s+i.Prix*i.qty,0); let rem=Math.round(sub*DISC/100); document.getElementById('det').innerHTML=CART.map(c=>`${c.qty}x ${c.Designation}`).join('<br>')+`<hr>Total: ${(sub-rem).toLocaleString()}`; document.getElementById('checkoutM').classList.add('show');}
function closeM(id){document.getElementById(id).classList.remove('show');}
function valider(){ let nom=document.getElementById('cliNom').value||'Anonyme'; let phone=document.getElementById('cliPhone').value||''; let pay=document.getElementById('pay').value; let sub=CART.reduce((s,i)=>s+i.Prix*i.qty,0); let rem=Math.round(sub*DISC/100); let total=sub-rem; let vente={id:Date.now(),date:new Date().toISOString(),boutique:SHOP,items:[...CART],subtotal:sub,remise_pct:DISC,total,benefice:total-CART.reduce((s,i)=>s+i.Achat*i.qty,0),payement:pay,client:{nom,phone}}; let V=JSON.parse(localStorage.getItem('ventes_'+SHOP)||'[]'); V.push(vente); localStorage.setItem('ventes_'+SHOP,JSON.stringify(V)); CART.forEach(ci=>{let p=PRODUCTS.find(pr=>pr.CODE===ci.CODE); if(p) p.Quantite-=ci.qty;}); localStorage.setItem('products_'+SHOP,JSON.stringify(PRODUCTS)); CART=[]; DISC=0; document.getElementById('disc').value=''; updateCart(); render(); closeM('checkoutM'); alert('Vente OK '+total.toLocaleString());}
function openStats(){document.getElementById('statsM').classList.add('show'); filterS('jour');}
function filterS(f){ let V=JSON.parse(localStorage.getItem('ventes_'+SHOP)||'[]'); let now=new Date(); if(f==='jour') V=V.filter(v=>new Date(v.date).toDateString()===now.toDateString()); if(f==='semaine'){let d=new Date(); d.setDate(d.getDate()-7); V=V.filter(v=>new Date(v.date)>=d);} document.getElementById('statsL').innerHTML=V.reverse().slice(0,50).map(v=>`<div style="border-bottom:1px solid #eee;padding:5px 0">${new Date(v.date).toLocaleString()} - ${v.total.toLocaleString()} FC - ${v.client.nom}</div>`).join('')||'Aucune';}
function exportVentes(){ let V=localStorage.getItem('ventes_'+SHOP)||'[]'; let b=new Blob([V],{type:'application/json'}); let u=URL.createObjectURL(b); let a=document.createElement('a'); a.href=u; a.download=`ventes_${SHOP}_${new Date().toISOString().slice(0,10)}.json`; a.click();}
loadStock();
</script></body></html>
