<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BATEKE V4.1.2 PRO - PATRON FIX</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
body{font-family:Arial;background:#0f172a;color:#e2e8f0;margin:0;padding:10px}
header{background:#1e293b;padding:15px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
h1{color:#facc15;margin:0;font-size:22px}
.card{background:#1e293b;padding:15px;border-radius:12px;margin-top:12px}
button{padding:10px 14px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.btn-yellow{background:#facc15;color:#000}.btn-green{background:#22c55e;color:#000}
input,select{padding:8px;border-radius:6px;border:none}
table{width:100%;border-collapse:collapse;margin-top:10px;background:white;color:black;border-radius:8px;overflow:hidden}
th{background:#0f172a;color:white;padding:8px;font-size:12px} td{padding:6px;border-bottom:1px solid #ddd;font-size:12px;text-align:center}
.rouge{background:#fecaca!important;font-weight:bold}
.log{background:#000;color:#0f0;padding:10px;border-radius:8px;font-family:monospace;font-size:12px;max-height:200px;overflow:auto;margin-top:10px}
</style></head>
<body>
<header>
<div><h1>👑 BATEKE V4.1.2 PRO - PATRON FIX</h1><small>bateke-v4 connecté - Seuil 3</small></div>
<div>
<select id="magasin"><option value="mbakana">Mbakana</option><option value="menkao1">Menkao1</option><option value="menkao2">Menkao2</option></select>
<input type="file" id="fileInput" accept=".xlsx,.xls,.json">
<button class="btn-yellow" onclick="importer()">📥 Importer</button>
<button class="btn-green" onclick="exportJSON()">💾 Export JSON</button>
</div>
</header>
<div id="log" class="log">Prêt. Firebase bateke-v4...</div>
<div class="card">
<h3>📦 STOCK - Seuil 3 - <span id="count">0 produits</span></h3>
<table id="stockTable"><thead><tr><th>Code</th><th>Designation</th><th>Qté</th><th>Seuil</th><th>Achat</th><th>Vente</th><th>Bénéf/Unit</th><th>Action</th></tr></thead><tbody></tbody></table>
</div>
<div class="card">
<h3>📊 RAPPORTS PATRON</h3>
<div>Du: <input type="date" id="du" value="2026-08-01"> Au: <input type="date" id="au" value="2026-08-30">
<button class="btn-green" onclick="genererRapport()">Générer</button> <button class="btn-yellow" onclick="window.print()">📄 Export PDF</button>
</div>
<div id="rapport" style="background:white;color:black;padding:15px;border-radius:8px;margin-top:10px">Rapport en attente</div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB0D421bg7tGVafz44cwCyIOCujgAn5MNY",
  authDomain: "bateke-v4.firebaseapp.com",
  databaseURL: "https://bateke-v4-default-rtdb.firebaseio.com",
  projectId: "bateke-v4",
  storageBucket: "bateke-v4.firebasestorage.app",
  messagingSenderId: "321333206282",
  appId: "1:321333206282:web:6d1603446be3d195de6ef3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let stock = [];
function log(t){ document.getElementById('log').innerHTML += "<br>> "+t; document.getElementById('log').scrollTop=9999; console.log(t); }
function importer(){
  const f = document.getElementById('fileInput').files[0];
  const mag = document.getElementById('magasin').value;
  if(!f){ alert("Choisis un fichier"); return; }
  log("Fichier: "+f.name+" Magasin: "+mag);
  if(f.name.endsWith('.json')){
    const r = new FileReader(); r.onload = e => { traiterDonnees(JSON.parse(e.target.result), mag); }; r.readAsText(f);
  } else {
    const r = new FileReader(); r.onload = e => {
      const wb = XLSX.read(e.target.result, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet);
      log("Excel lu: "+json.length+" lignes Colonnes: "+Object.keys(json[0]||{}).join(", "));
      const mapped = json.map((row,i)=>{
        const code = row['C0DE']||row['CODE']||row['Code']||'C'+i;
        const des = row['Designation']||row['DESIGNATION']||'';
        let pu = row['Prix Unit']||row['Prix Unit ']||row['PRIX UNIT']||row['Prix']||0;
        let qte = row['Quantite']||row['QUANTITE']||0;
        if(typeof pu==='string') pu = parseFloat(pu.replace(/[^0-9]/g,''))||0;
        if(typeof qte==='string') qte = parseInt(qte.replace(/[^0-9]/g,''))||0;
        return {code:String(code).trim(), designation:String(des).trim(), prix_vente:parseFloat(pu)||0, prix_achat:Math.round((parseFloat(pu)||0)*0.7*100)/100, quantite:parseInt(qte)||0, seuil:3};
      }).filter(x=>x.designation);
      log("Mappé: "+mapped.length+" produits"); traiterDonnees(mapped, mag);
    }; r.readAsArrayBuffer(f);
  }
}
function traiterDonnees(data, magasin){
  stock=data; afficher(); log("Import OK: "+data.length);
  let count=0;
  log("Envoi vers Firebase /magasins/"+magasin+"/stock...");
  data.forEach(p=>{
    db.ref('magasins/'+magasin+'/stock/'+p.code).set(p).then(()=>{
      count++; if(count%100==0) log(count+"/"+data.length);
      if(count==data.length) log("✅ FINI "+count+" produits dans Firebase!");
    }).catch(e=>log("Erreur "+e.message));
  });
  localStorage.setItem('stock_'+magasin, JSON.stringify(data));
}
function afficher(){
  const tbody=document.querySelector('#stockTable tbody'); tbody.innerHTML='';
  stock.forEach(p=>{ const tr=document.createElement('tr'); if(p.quantite<=p.seuil) tr.className='rouge'; tr.innerHTML=`<td>${p.code}</td><td>${p.designation}</td><td>${p.quantite}</td><td>${p.seuil}</td><td>${p.prix_achat}</td><td>${p.prix_vente}</td><td>${(p.prix_vente-p.prix_achat).toFixed(0)}</td><td><button onclick="vendre('${p.code}')">Vendre</button></td>`; tbody.appendChild(tr); });
  document.getElementById('count').textContent=stock.length+" produits";
}
function vendre(code){ const p=stock.find(x=>x.code==code); if(!p||p.quantite<=0){alert("Rupture");return;} p.quantite--; const mag=document.getElementById('magasin').value; db.ref('magasins/'+mag+'/stock/'+code+'/quantite').set(p.quantite); localStorage.setItem('stock_'+mag, JSON.stringify(stock)); afficher(); }
function exportJSON(){ const mag=document.getElementById('magasin').value; const blob=new Blob([JSON.stringify(stock,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=mag+'_fixed.json'; a.click(); }
function genererRapport(){ const du=document.getElementById('du').value; const au=document.getElementById('au').value; document.getElementById('rapport').innerHTML=`<b>Rapport du ${du} au ${au}</b><br>${stock.length} produits. Rupture: ${stock.filter(s=>s.quantite<=3).map(s=>s.designation).slice(0,10).join(', ')}`; }
window.onload=()=>{
  log("Firebase connecté: bateke-v4");
  log("XLSX: "+(typeof XLSX!=='undefined'?'OK':'ERREUR'));
  const mag=document.getElementById('magasin').value; const saved=localStorage.getItem('stock_'+mag); if(saved){ stock=JSON.parse(saved); afficher(); log("Restauré local: "+stock.length); }
}
</script></body></html>
