<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BATEKE V4.1 PRO - Patron</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, addDoc, updateDoc, query, where, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyC-V7h2Uve6FUSY2sBo7Rq-a3O0Qbm0W0o", authDomain: "bateke-v4.firebaseapp.com", projectId: "bateke-v4" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let currentShop = "Menkao1";
let allStock = []; let allVentes = [];
window.changeShop = async () => { currentShop = document.getElementById("shopSelect").value; loadAll(); }
window.loadAll = async () => { await loadStock(); await loadVentes(); }
window.loadStock = async () => {
  const snap = await getDocs(collection(db, "shops", currentShop, "stock"));
  allStock = []; let html=`<tr><th>Code</th><th>Designation</th><th>Qté</th><th>Seuil</th><th>Achat</th><th>Vente</th><th>Bénéf/Unit</th><th>Action</th></tr>`;
  snap.forEach(d=>{ const p={id:d.id,...d.data()}; allStock.push(p);
    const benef = (p.prix_vente||0)-(p.prix_achat||0);
    const alert = (p.quantite||0) <= (p.seuil||3)? 'style="background:#ef4444"' : '';
    html+=`<tr ${alert}><td>${p.code}</td><td>${p.designation}</td><td>${p.quantite}</td><td>${p.seuil||3}</td><td>${p.prix_achat}</td><td>${p.prix_vente}</td><td>${benef}</td>
    <td><button onclick="editProd('${p.id}')">✏️</button> <button onclick="delProd('${p.id}')">🗑️</button></td></tr>`; });
  document.getElementById("stockTable").innerHTML=html;
  document.getElementById("count").innerText=allStock.length+" produits - Seuil alerte: 3";
}
window.editProd = async (id) => {
  const p = allStock.find(x=>x.id==id);
  const newDes = prompt("Désignation:", p.designation); if(newDes===null) return;
  const newQte = prompt("Quantité:", p.quantite);
  const newSeuil = prompt("Seuil alerte (défaut 3):", p.seuil||3);
  const newAchat = prompt("Prix Achat:", p.prix_achat);
  const newVente = prompt("Prix Vente:", p.prix_vente);
  await updateDoc(doc(db, "shops", currentShop, "stock", id), {
    designation: newDes, quantite: parseInt(newQte), seuil: parseInt(newSeuil)||3,
    prix_achat: parseFloat(newAchat), prix_vente: parseFloat(newVente)
  });
  loadStock();
}
window.delProd = async (id) => { if(confirm("Supprimer?")){ await deleteDoc(doc(db,"shops",currentShop,"stock",id)); loadStock(); } }
window.importFile = async (e) => {
  const file=e.target.files[0]; if(!file) return;
  let data=[];
  if(file.name.endsWith(".json")){ const txt=await file.text(); const j=JSON.parse(txt); data=Array.isArray(j)?j:(j.stock||[]); }
  else{ const buf=await file.arrayBuffer(); const wb=XLSX.read(buf); data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]); }
  const cleaned=data.map((p,i)=>({
    code:(p.C0DE||p.code||"C"+i).toString().trim(), designation:(p.Designation||p.designation||"").toString().trim(),
    prix_vente:parseFloat(p["Prix Unit"]||p.prix_vente||0), prix_achat:parseFloat(p.prix_achat||p["Prix Unit"]*0.7||0),
    quantite:parseInt(p.Quantite||p.quantite||0), seuil: parseInt(p.seuil||p.Seuil||3), categorie:"General", dateEntree: new Date()
  })).filter(p=>p.designation);
  for(const p of cleaned){ await addDoc(collection(db,"shops",currentShop,"stock"), p); }
  alert("✅ "+cleaned.length+" importés dans "+currentShop); loadStock();
}
window.loadVentes = async () => {
  const snap = await getDocs(collection(db,"shops",currentShop,"ventes"));
  allVentes=[]; snap.forEach(d=>allVentes.push(d.data()));
}
window.genererRapport = () => {
  const du = new Date(document.getElementById("dateDu").value); const au = new Date(document.getElementById("dateAu").value); au.setHours(23,59,59);
  const type = document.getElementById("typeRapport").value;
  let filtered = allVentes.filter(v=>{ const dv = v.date?.toDate? v.date.toDate() : new Date(v.date); return dv>=du && dv<=au; });
  let html=""; let totalCA=0; let totalBen=0;
  if(type=="ventes"){ html=`<h3>Ventes du ${du.toLocaleDateString()} au ${au.toLocaleDateString()}</h3><table border=1 style='width:100%;color:black;background:white'><tr><th>Date</th><th>Produit</th><th>Qté</th><th>CA</th><th>Bénéf</th></tr>`;
    filtered.forEach(v=>{ const benef=(v.prix_vente-v.prix_achat)*v.quantite; totalCA+=v.prix_vente*v.quantite; totalBen+=benef; html+=`<tr><td>${v.date?.toDate? v.date.toDate().toLocaleDateString(): v.date}</td><td>${v.designation}</td><td>${v.quantite}</td><td>${v.prix_vente*v.quantite}</td><td>${benef}</td></tr>`; });
    html+=`</table><h3>CA: ${totalCA} | Bénéfice Patron: ${totalBen}</h3>`; }
  if(type=="top"){ const map={}; filtered.forEach(v=>{ map[v.designation]=(map[v.designation]||0)+v.quantite; }); const sorted=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,10);
    html=`<h3>Top 10 Meilleurs Produits Vendus</h3><ol>`+sorted.map(s=>`<li>${s[0]} : ${s[1]} vendus</li>`).join("")+`</ol>`; }
  if(type=="invendus"){ const vendusSet=new Set(filtered.map(v=>v.designation)); const inv = allStock.filter(s=>!vendusSet.has(s.designation));
    html=`<h3>Invendus sur période (${inv.length})</h3><ul>`+inv.map(i=>`<li>${i.designation} - Stock: ${i.quantite}</li>`).join("")+`</ul>`; }
  if(type=="entrees"){ html=`<h3>Entrées Stock (actuel)</h3><table border=1 style='width:100%;color:black;background:white'><tr><th>Produit</th><th>Qté</th><th>Date Entrée</th></tr>`+allStock.map(s=>`<tr><td>${s.designation}</td><td>${s.quantite}</td><td>${s.dateEntree||'-'}</td></tr>`).join("")+`</table>`; }
  document.getElementById("rapportResult").innerHTML=html;
}
window.exportPDF = () => {
  const { jsPDF } = window.jspdf; const doc = new jsPDF();
  doc.text(`Rapport ${document.getElementById("typeRapport").value} - ${currentShop} - Du ${document.getElementById("dateDu").value} au ${document.getElementById("dateAu").value}`,10,10);
  doc.autoTable({ html: '#rapportResult table', startY:20 });
  doc.save(`Rapport_${currentShop}_${document.getElementById("typeRapport").value}.pdf`);
}
window.onload=()=>{ const today=new Date().toISOString().split('T')[0]; document.getElementById("dateDu").value=today; document.getElementById("dateAu").value=today; loadAll(); }
</script>
<style>body{font-family:Arial;background:#0f172a;color:white;padding:15px}h1{color:#facc15}.card{background:#1e293b;padding:15px;border-radius:10px;margin:10px 0}button{padding:8px 12px;border-radius:6px;border:none;cursor:pointer;background:#22c55e;color:black;font-weight:bold}table{width:100%;background:white;color:black;border-collapse:collapse;margin-top:10px}th,td{padding:6px;border:1px solid #ccc;font-size:12px}input,select{padding:8px;border-radius:6px}</style>
</head>
<body>
<h1>👑 BATEKE V4.1 PRO - PATRON</h1>
<select id="shopSelect" onchange="changeShop()"><option>Menkao1</option><option>Menkao2</option><option>Mbakana</option></select>
<input type="file" accept=".xlsx,.json" onchange="importFile(event)">
<div class="card"><h3>📦 STOCK - Seuil défaut 3 (Bénéfice visible Patron seul)</h3><div id="count"></div><table id="stockTable"></table></div>
<div class="card"><h3>📊 RAPPORTS PATRON</h3>
Du: <input type="date" id="dateDu"> Au: <input type="date" id="dateAu">
<select id="typeRapport"><option value="ventes">Ventes + CA + Bénéfice</option><option value="top">Meilleurs Produits Vendus</option><option value="invendus">Invendus période</option><option value="entrees">Entrées Stock période</option><option value="depenses">Dépenses période</option></select>
<button onclick="genererRapport()">Générer</button> <button onclick="exportPDF()" style="background:#facc15">📄 Export PDF</button>
<div id="rapportResult" style="background:white;color:black;padding:10px;margin-top:10px;border-radius:8px">Choisis une période et génère</div>
</div>
</body>
</html>
