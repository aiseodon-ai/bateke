<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Patron V4.7.7 SANS BLOCAGE</title>
<style>body{margin:0;font-family:Arial;background:#f0f2f5}header{background:#111;color:#fff;padding:10px;text-align:center;position:sticky;top:0;z-index:30}
.card{background:#fff;border-radius:12px;padding:12px;margin:8px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
#loginPat{position:fixed;inset:0;background:#111;z-index:9999;display:flex;align-items:center;justify-content:center}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script></head><body>
<div id="loginPat"><div style="background:#fff;padding:25px;border-radius:16px;max-width:300px;width:90%;text-align:center">
<h3>👑 PATRON</h3>
<input id="pinPat" type="text" placeholder="9999" style="text-align:center;font-size:32px;letter-spacing:8px;width:100%;padding:10px;border:2px solid #0b5e2f;border-radius:8px">
<button onclick="loginPat()" style="width:100%;margin-top:12px;background:#0b5e2f;color:#fff;padding:14px;border:none;border-radius:8px;font-weight:bold;font-size:16px">ENTRER</button>
<button onclick="document.getElementById('loginPat').style.display='none'" style="width:100%;margin-top:8px;background:red;color:#fff;padding:12px;border:none;border-radius:8px;font-weight:bold">BYPASS ROUGE - CLIQUE ICI SI 9999 BLOQUE</button>
<p id="msgPat" style="color:red;font-size:12px;margin-top:8px"></p>
</div></div>
<script>
function loginPat(){
 let v=document.getElementById('pinPat').value.replace(/\D/g,'');
 if(v==='9999' || v==='1234' || v.includes('9999') || v!==''){
  document.getElementById('loginPat').style.display='none';
  alert('Login OK avec '+v);
  // ICI TU RECOLLERAS LE V4.7.5 COMPLET APRES CE TEST
 } else {
  document.getElementById('msgPat').innerText='Tape 9999';
 }
}
</script>
<div style="padding:20px"><h2>Si tu vois cette page, le login a réussi ✅</h2><p>Dis moi et je te renvoie le fichier complet patron avec tous les rapports.</p></div></body></html>
