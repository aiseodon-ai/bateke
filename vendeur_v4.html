<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vendeur V4 Pro</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f4f4}header{background:#0b5e2f;color:#fff;padding:10px;position:sticky;top:0;z-index:9}.badge{background:#FFD700;color:#000;padding:4px 10px;border-radius:20px;font-weight:bold}.card{background:#fff;margin:8px;border-radius:12px;padding:10px}.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:bold;margin-top:6px}.btn-g{background:#0b5e2f;color:#fff}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;padding:10px}.modal.show{display:flex}.box{background:#fff;width:100%;max-width:420px;border-radius:12px;padding:15px;max-height:90vh;overflow:auto}input,select{width:100%;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #ccc}</style><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script></head><body><header><div style="display:flex;justify-content:space-between"><span id="shopB" class="badge">SHOP</span><b id="caisseInfo">Caisse: 0 FC</b><span onclick="openCaisse()" style="background:#fff;color:#0b5e2f;padding:5px 8px;border-radius:8px">💰</span></div><small id="info">V4 Temps Réel + CRM</small></header><div style="padding:6px;display:flex;gap:5px"><input id="search" placeholder="Chercher produit..." oninput="render()"><button onclick="load()">🔄</button></div><div id="list"></div><div style="height:250px"></div><div style="position:fixed;bottom:0;left:0;right:0;background:#111;color:#fff;padding:10px"><div style="display:flex;justify-content:space-between"><span id="cartC">0 art</span><b id="cartT">0 FC</b><input id="rem" type="number" placeholder="Remise% max5" style="width:80px;border:none;border-radius:6px;padding:4px" oninput="updateCart()"></div><div id="cartI" style="font-size:11px;max-height:60px;overflow:auto"></div><button class="btn" style="background:#25D366;color:#fff" onclick="openClient()">VENDRE + CRM</button></div><div class="modal" id="clientM"><div class="box"><h3>Client & Fidélité</h3><select id="cliType" onchange="toggleCli()"><option value="anonyme">Anonyme</option><option value="existant">Client existant</option><option value="nouveau">Nouveau client</option></select><div id="cliSearchDiv" style="display:none"><input id="cliSearch" placeholder="Tel ou Nom..." oninput="searchClient()"><div id="cliRes"></div></div><div id="cliForm"><input id="cliNom" placeholder="Nom client"><input id="cliTel" placeholder="Téléphone (clé fidélité)"><input id="cliQuartier" placeholder="Quartier"></div><div id="det"></div><p><b>Points: <span id="pts">0</span></b></p><select id="pay"><option value="paye">Payé</option><option value="credit">Crédit client</option></select><button class="btn btn-g" onclick="validerVente()">CONFIRMER VENTE LIVE</button><button class="btn" style="background:#eee" onclick="closeM('clientM')">Annuler</button></div></div><div class="modal" id="caisseM"><div class="box"><h3>💰 Caisse - <span id="shopNameC"></span></h3><div class="card" style="background:#e8f5e9">Ventes: <b id="vJour">0</b><br>Dépenses: <b id="dJour" style="color:red">0</b><br><hr>À VERSER: <b id="aVerser" style="font-size:18px">0</b></div><input id="depMotif" placeholder="Motif (Ration, Moto...)"><input id="depMontant" type="number" placeholder="Montant"><button class="btn" style="background:#ff9800;color:#fff" onclick="addDepense()">➖ Dépense</button><hr><input id="versMontant" type="number" placeholder="Montant versé"><button class="btn btn-g" onclick="addVersement()">✅ Versement</button><div id="journal" style="font-size:11px;max-height:150px;overflow:auto"></div><button class="btn" style="background:#eee" onclick="closeM('caisseM')">Fermer</button></div></div><script>const firebaseConfig={apiKey:"AIzaSyB0D421bg7tGVafz44cwCyIOCUjgAn5MNY",authDomain:"bateke-v4.firebaseapp.com",databaseURL:"https://bateke-v4-default-rtdb.firebaseio.com",projectId:"bateke-v4",storageBucket:"bateke-v4.firebasestorage.app",messagingSenderId:"321333206282",appId:"1:321333206282:web:6d1603446be3d195de6ef3"};firebase.initializeApp(firebaseConfig);const db=firebase.database();let SHOP=new URLSearchParams(location.search).get('shop')||localStorage.getItem('bateke_shop')||'Menkao1';localStorage.setItem('bateke_shop',SHOP);document.getElementById('shopB').innerText=SHOP;document.getElementById('shopNameC').innerText=SHOP;let PRODUCTS=[],CART=[],CLIENTS={},VENTES_JOUR=[],DEP_JOUR=[];function load(){db.ref('shops/'+SHOP+'/stock').on('value',snap=>{PRODUCTS=snap.val()?Object.values(snap.val()):[];document.getElementById('info').innerText=PRODUCTS.length+' produits LIVE';render();});db.ref('shops/'+SHOP+'/clients').on('value',s=>{CLIENTS=s.val()||{}});listenCaisse();}function render(){let q=(document.getElementById('search').value||'').toLowerCase();let f=PRODUCTS.filter(p=>(p.Designation||'').toLowerCase().includes(q)||(p.CODE||'').toLowerCase().includes(q)).slice(0,60);document.getElementById('list').innerHTML=f.map(p=>`<div class="card" style="display:flex;justify-content:space-between;border-left:${p.Quantite<=(p.seuil||5)?'5px solid red':'5px solid #0b5e2f'}"><div><b>${p.CODE}</b> ${p.Designation}<br><small>Stock:${p.Quantite}</small><br><b style="color:#0b5e2f">${(p['Prix Unit']||0).toLocaleString()} FC</b><br><small>Benef:${((p['Prix Unit']||0)-(p['Prix Achat']||0)).toLocaleString()}</small></div><div><button onclick="add('${p.CODE}',-1)">-</button> <span>${CART.find(c=>c.CODE===p.CODE)?.qty||0}</span> <button onclick="add('${p.CODE}',1)">+</button></div></div>`).join('');}function add(code,d){let p=PRODUCTS.find(x=>x.CODE===code);let it=CART.find(c=>c.CODE===code);let cur=it?it.qty:0;let nxt=cur+d;if(d>0&&p.Quantite<=cur){alert('Stock insuffisant');return;}if(nxt<=0)CART=CART.filter(c=>c.CODE!==code);else{if(it)it.qty=nxt;else CART.push({CODE:p.CODE,Designation:p.Designation,Prix:p['Prix Unit'],Achat:p['Prix Achat']||0,qty:1});}render();updateCart();}function updateCart(){let sub=CART.reduce((s,i)=>s+i.Prix*i.qty,0);let remPct=parseInt(document.getElementById('rem').value)||0;if(remPct>5){remPct=5;document.getElementById('rem').value=5}let tot=sub-Math.round(sub*remPct/100);document.getElementById('cartC').innerText=CART.reduce((s,i)=>s+i.qty,0)+' art';document.getElementById('cartT').innerText=tot.toLocaleString()+' FC';document.getElementById('cartI').innerHTML=CART.map(c=>`${c.qty}x ${c.Designation}`).join('<br>');document.getElementById('pts').innerText=Math.floor(tot/10000);document.getElementById('det').innerHTML=CART.map(c=>`${c.qty}x ${c.Designation}`).join('<br>')+`<hr>Total:${tot.toLocaleString()}`;}function openClient(){if(!CART.length){alert('Panier vide');return;}document.getElementById('clientM').classList.add('show');}function toggleCli(){let v=document.getElementById('cliType').value;document.getElementById('cliSearchDiv').style.display=v==='existant'?'block':'none';document.getElementById('cliForm').style.display=v==='anonyme'?'none':'block';}function searchClient(){let q=(document.getElementById('cliSearch').value||'').toLowerCase();let res=Object.values(CLIENTS).filter(c=>(c.tel||'').includes(q)||(c.nom||'').toLowerCase().includes(q)).slice(0,5);document.getElementById('cliRes').innerHTML=res.map(c=>`<div onclick="selectCli('${c.tel}')" style="padding:5px;border-bottom:1px solid #eee">${c.nom} - ${c.tel} - Pts:${c.points||0}</div>`).join('');}function selectCli(tel){let c=CLIENTS[tel];if(c){document.getElementById('cliNom').value=c.nom;document.getElementById('cliTel').value=c.tel;document.getElementById('cliQuartier').value=c.quartier||'';}}function validerVente(){let nom=document.getElementById('cliNom').value||'Anonyme';let tel=document.getElementById('cliTel').value||'';let quartier=document.getElementById('cliQuartier').value||'';let pay=document.getElementById('pay').value;let sub=CART.reduce((s,i)=>s+i.Prix*i.qty,0);let remPct=parseInt(document.getElementById('rem').value)||0;let total=sub-Math.round(sub*remPct/100);let benef=total-CART.reduce((s,i)=>s+i.Achat*i.qty,0);let vente={id:Date.now(),date:new Date().toISOString(),boutique:SHOP,items:CART,subtotal:sub,remise:remPct,total,benefice:benef,payement:pay,client:{nom,tel,quartier}};db.ref('shops/'+SHOP+'/ventes/'+vente.id).set(vente);CART.forEach(ci=>{let p=PRODUCTS.find(x=>x.CODE===ci.CODE);if(p){db.ref('shops/'+SHOP+'/stock/'+ci.CODE).update({Quantite:p.Quantite-ci.qty});}});if(tel){let old=CLIENTS[tel]||{nom,tel,quartier,points:0,totalAchat:0,nbVisites:0};db.ref('shops/'+SHOP+'/clients/'+tel).set({nom,tel,quartier,points:(old.points||0)+Math.floor(total/10000),totalAchat:(old.totalAchat||0)+total,nbVisites:(old.nbVisites||0)+1,derniereVisite:new Date().toISOString()});}CART=[];updateCart();render();closeM('clientM');alert('Vente LIVE envoyée! Benef: '+benef.toLocaleString());}function openCaisse(){document.getElementById('caisseM').classList.add('show');}function listenCaisse(){let today=new Date().toDateString();db.ref('shops/'+SHOP+'/ventes').on('value',snap=>{let all=Object.values(snap.val()||{});VENTES_JOUR=all.filter(v=>new Date(v.date).toDateString()===today);document.getElementById('vJour').innerText=VENTES_JOUR.reduce((s,v)=>s+v.total,0).toLocaleString()+' FC';calcAVerser();});db.ref('shops/'+SHOP+'/depenses').on('value',snap=>{let all=Object.values(snap.val()||{});DEP_JOUR=all.filter(d=>new Date(d.date).toDateString()===today);document.getElementById('dJour').innerText=DEP_JOUR.reduce((s,d)=>s+d.montant,0).toLocaleString()+' FC';calcAVerser();});db.ref('shops/'+SHOP+'/versements').on('value',()=>{calcAVerser();});}function calcAVerser(){db.ref('shops/'+SHOP+'/versements').once('value').then(s=>{let today=new Date().toDateString();let vers=Object.values(s.val()||{}).filter(v=>new Date(v.date).toDateString()===today).reduce((sum,v)=>sum+v.montant,0);let tv=VENTES_JOUR.reduce((s,v)=>s+v.total,0);let td=DEP_JOUR.reduce((s,d)=>s+d.montant,0);let aVerser=tv-td-vers;document.getElementById('aVerser').innerText=aVerser.toLocaleString()+' FC';document.getElementById('caisseInfo').innerText='Caisse: '+aVerser.toLocaleString()+' FC';});}function addDepense(){let motif=document.getElementById('depMotif').value;let montant=parseInt(document.getElementById('depMontant').value);if(!motif||!montant)return alert('Remplis');db.ref('shops/'+SHOP+'/depenses/'+Date.now()).set({date:new Date().toISOString(),motif,montant,boutique:SHOP});document.getElementById('depMotif').value='';document.getElementById('depMontant').value='';}function addVersement(){let montant=parseInt(document.getElementById('versMontant').value);if(!montant)return alert('Montant');db.ref('shops/'+SHOP+'/versements/'+Date.now()).set({date:new Date().toISOString(),montant,boutique:SHOP});document.getElementById('versMontant').value='';alert('Versement OK, patron voit LIVE');}function closeM(id){document.getElementById(id).classList.remove('show');}load();</script></body></html>
