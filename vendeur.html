<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BATEKE Vendeur V4.7 Locked</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
body{margin:0;font-family:Arial;background:#0b1210;color:#fff;padding:12px}
.box{max-width:480px;margin:auto;background:#111827;border-radius:16px;padding:16px}
h2{margin:0 0 10px;text-align:center}
input,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#0f172a;color:#fff;box-sizing:border-box}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:8px}
.btn-b{background:#0ea5e9;color:#fff}.btn-g{background:#0b5e2f;color:#fff}
.lock{background:#0b5e2f;color:#fff;padding:8px;border-radius:8px;text-align:center;font-size:13px;margin-bottom:10px;display:none}
.row{display:flex;gap:8px}.row>div{flex:1}
small{color:#9ca3af}
.stock{max-height:200px;overflow:auto;background:#0f172a;border-radius:10px;padding:8px;margin:8px 0;font-size:12px}
.item{padding:6px;border-bottom:1px solid #222;cursor:pointer}
.item:hover{background:#1f2937}
.badge{float:right;background:#0b5e2f;padding:2px 6px;border-radius:6px;font-size:11px}
</style>
</head><body>
<div class="box">
<div id="lockBanner" class="lock"></div>
<h2>🛒 Vendeur V4.7</h2>
<select id="shop"><option value="Menkao1">Menkao1</option><option value="Menkao2">Menkao2</option><option value="Mbakana">Mbakana</option></select>
<input id="search" placeholder="Chercher produit AC001..." oninput="filterStock()">
<div id="stockList" class="stock"></div>
<input id="code" placeholder="Code produit">
<input id="qty" type="number" placeholder="Quantité" value="1">
<div class="row"><div><input id="remise" type="number" placeholder="Remise % max 5" max="5" min="0" value="0"></div><div><input id="tel" placeholder="Tél client ex: 089..."></div></div>
<input id="client" placeholder="Nom client (optionnel)">
<button class="btn btn-b" onclick="vendre()">✅ VALIDER VENTE</button>
<div id="msg" style="margin-top:10px;font-size:13px;text-align:center"></div>
<small style="display:block;margin-top:10px;text-align:center">Firebase bateke-v4 lié temps réel</small>
</div>
<script>
// === CONFIG FIREBASE BATEKE-V4 ===
const firebaseConfig={apiKey:"AIzaSyC1...",authDomain:"bateke-v4.firebaseapp.com",projectId:"bateke-v4"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

// === LOCK BOUTIQUE LOGIC ===
(function(){
 const params=new URLSearchParams(window.location.search);
 let shopParam=params.get('shop');
 if(shopParam){localStorage.setItem('vendeur_shop_locked',shopParam);localStorage.setItem('shop',shopParam);}
 let locked=localStorage.getItem('vendeur_shop_locked')||shopParam;
 if(locked){
  window.addEventListener('DOMContentLoaded',()=>{
   let sel=document.getElementById('shop');
   sel.value=locked; sel.disabled=true; sel.style.opacity="0.6"; sel.style.background="#111";
   [...sel.options].forEach(o=>{if(o.value!==locked)o.style.display='none';});
   document.getElementById('lockBanner').style.display='block';
   document.getElementById('lockBanner').innerHTML=`🔒 Boutique verrouillée : <b>${locked}</b> - Ventes vers ${locked} uniquement`;
  });
 }
})();
let allStock=[];
async function loadStock(){
 let shop=document.getElementById('shop').value||localStorage.getItem('vendeur_shop_locked')||'Menkao1';
 let snap=await db.collection('stocks').where('shop','==',shop).get();
 allStock=snap.docs.map(d=>({id:d.id,...d.data()}));
 renderStock(allStock);
}
function renderStock(list){
 document.getElementById('stockList').innerHTML=list.map(p=>`<div class="item" onclick="pick('${p.code}')">${p.code} - ${p.designation||''} <span class="badge">${p.qte||0} | ${p.pv||0}Fc</span></div>`).join('');
}
function filterStock(){
 let q=document.getElementById('search').value.toLowerCase();
 renderStock(allStock.filter(p=>p.code.toLowerCase().includes(q)||(p.designation||'').toLowerCase().includes(q)));
}
function pick(code){document.getElementById('code').value=code;}
document.getElementById('shop').addEventListener('change',loadStock);
window.addEventListener('DOMContentLoaded',loadStock);

async function vendre(){
 let shop=localStorage.getItem('vendeur_shop_locked')||document.getElementById('shop').value;
 let code=document.getElementById('code').value.trim();
 let qty=parseInt(document.getElementById('qty').value)||1;
 let remise=parseFloat(document.getElementById('remise').value)||0;
 let tel=document.getElementById('tel').value.trim();
 let client=document.getElementById('client').value.trim();
 if(!code){alert('Code vide');return;}
 if(remise>5){alert('Remise max 5%');return;}
 let prod=allStock.find(p=>p.code===code);
 if(!prod){alert('Produit introuvable');return;}
 if(prod.qte<qty){alert('Stock insuffisant');return;}
 let pv=prod.pv; let total=pv*qty*(1-remise/100);
 await db.collection('ventes').add({shop,code,qte:qty,pv,remise,tel,client,total,pa:prod.pa||0,date:firebase.firestore.FieldValue.serverTimestamp()});
 await db.collection('stocks').doc(prod.id).update({qte:prod.qte-qty});
 document.getElementById('msg').innerHTML=`✅ Vendu ${qty}x ${code} → ${total}Fc à ${shop}`;
 // FIX champs vide après vente
 document.getElementById('code').value='';document.getElementById('qty').value='1';document.getElementById('remise').value='0';document.getElementById('tel').value='';document.getElementById('client').value='';document.getElementById('search').value='';
 loadStock();
}
</script>
</body></html>
