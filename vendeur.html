<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Vendeur V4.7 FIX</title>
<style>
body{margin:0;font-family:Arial;background:#f5f6fa}header{background:#0b5e2f;color:#fff;padding:12px;text-align:center;position:sticky;top:0;z-index:30}
.card{background:#fff;border-radius:12px;padding:12px;margin:8px;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.tabs{display:flex;background:#fff;position:sticky;top:70px;z-index:20;border-bottom:2px solid #eee;overflow-x:auto}.tabs button{flex:1;min-width:70px;padding:12px;border:none;background:#fff}
.sec{display:none;padding:8px}.sec.active{display:block}
table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:6px;border:1px solid #ddd}th{background:#1e293b;color:#fff}
input,select{padding:10px;border-radius:8px;border:1px solid #ccc;width:100%;margin:4px 0;box-sizing:border-box}
.btn{padding:10px 14px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:3px}.btn-g{background:#0b5e2f;color:#fff;width:100%}.btn-y{background:#f59e0b}
.searchBox{position:relative}.suggest{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #ddd;border-radius:8px;max-height:200px;overflow:auto;z-index:10}
.panierItem{display:flex;justify-content:space-between;padding:6px;border-bottom:1px solid #eee}
.kpi{font-size:16px;font-weight:bold;color:#0b5e2f}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head><body>
<header><h3 style="margin:0">🏪 VENDEUR V4.7 - <span id="shopName"></span></h3>
<div style="display:flex;gap:5px;justify-content:center;margin-top:6px">
<select id="shopSel" onchange="switchShop()" style="width:130px"><option>Menkao1</option><option>Menkao2</option><option>Mbakana</option></select>
<small id="caJour" style="background:#fff;color:#0b5e2f;padding:4px 8px;border-radius:12px;font-weight:bold">CA Jour: 0</small>
</div></header>
<div class="tabs">
<button id="btn-vente" class="active" onclick="switchTab('vente')">🧾 Vente</button>
<button id="btn-stock" onclick="switchTab('stock')">📦 Stock</button>
<button id="btn-caisse" onclick="switchTab('caisse')">💰 Caisse</button>
<button id="btn-synthese" onclick="switchTab('synthese')">📊 Synthèse</button>
</div>
<div id="vente" class="sec active"><div class="card"><h4>Nouvelle Vente</h4>
<div class="searchBox"><input id="searchProd" placeholder="Code ou désignation..." oninput="onSearch()" autocomplete="off"><div id="suggest" class="suggest" style="display:none"></div></div>
<div id="panier"></div>
<div style="display:flex;gap:6px"><input id="remise" type="number" placeholder="Remise % (max 5)" max="5" style="width:100px"><input id="telClient" placeholder="Tél client"></div>
<div style="display:flex;gap:6px;margin-top:6px"><input id="nomClient" placeholder="Nom client (optionnel)"><b id="totalPanier" class="kpi">0 Fc</b></div>
<button class="btn btn-g" onclick="validerVente()">✅ VALIDER VENTE</button>
</div></div>
<div id="stock" class="sec"><div class="card"><h4>Stock</h4><table><thead><tr><th>Code</th><th>Qte</th><th>PV</th></tr></thead><tbody id="stockBody"></tbody></table></div></div>
<div id="caisse" class="sec"><div class="card"><h4>Caisse du jour</h4><div id="caisseList"></div><b id="caisseTotal">0 Fc</b></div></div>
<div id="synthese" class="sec"><div class="card"><h4>Synthèse</h4><div id="synth"></div></div></div>

<script>
// === LOCK BOUTIQUE PAR LIEN?shop=Menkao1 ===
(function(){
  const shopFromUrl = new URLSearchParams(window.location.search).get('shop');
  if(shopFromUrl) localStorage.setItem('shop_lock', shopFromUrl);
  const locked = localStorage.getItem('shop_lock');
  if(locked){
    window.addEventListener('DOMContentLoaded', ()=>{
      const sel=document.getElementById('shopSel');
      if(sel){ sel.value=locked; sel.disabled=true; sel.style.opacity='0.6'; sel.style.background='#ccc'; }
      const hdr=document.querySelector('header');
      if(hdr){ const b=document.createElement('div'); b.innerHTML='🔒 Boutique verrouillée: '+locked; b.style.cssText='background:#fff;color:#0b5e2f;padding:3px 8px;border-radius:8px;font-size:11px;margin-top:5px;display:inline-block'; hdr.appendChild(b); }
    });
  }
})();
// === CONFIG FIREBASE ===
const firebaseConfig={apiKey:"AIzaSyDummy",authDomain:"bateke-v4.firebaseapp.com",databaseURL:"https://bateke-v4-default-rtdb.firebaseio.com",projectId:"bateke-v4"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
let curShop=localStorage.getItem('shop_lock')||localStorage.getItem('curShop')||'Menkao1';
let stockData={}, panier=[];
function $(id){return document.getElementById(id)}
function switchTab(t){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));$(t).classList.add('active');$('btn-'+t).classList.add('active');}
function switchShop(){const v=$('shopSel').value; if(localStorage.getItem('shop_lock')&&v!==localStorage.getItem('shop_lock')){$('shopSel').value=localStorage.getItem('shop_lock');return;} curShop=v; localStorage.setItem('curShop',v); $('shopName').textContent=v; loadStock();}
function loadStock(){ db.ref('stocks/'+curShop).on('value', snap=>{ stockData=snap.val()||{}; renderStock(); calcCAJour(); }); }
function renderStock(){ let h=''; Object.keys(stockData).forEach(code=>{let p=stockData[code]; h+=`<tr><td>${code}</td><td>${p.qte||0}</td><td>${p.pv||0}</td></tr>`}); $('stockBody').innerHTML=h; }
function onSearch(){ let q=$('searchProd').value.toLowerCase(); let sug=$('suggest'); if(!q){sug.style.display='none';return;} let res=[]; Object.keys(stockData).forEach(code=>{ let p=stockData[code]; if(code.toLowerCase().includes(q)||(p.designation||'').toLowerCase().includes(q)) res.push({code,...p}); }); if(!res.length){sug.style.display='none';return;} sug.innerHTML=res.slice(0,10).map(r=>`<div style="padding:8px;border-bottom:1px solid #eee;cursor:pointer" onclick="addPanier('${r.code}')">${r.code} - ${r.designation||''} (${r.qte}) ${r.pv}Fc</div>`).join(''); sug.style.display='block'; }
function addPanier(code){ let p=stockData[code]; if(!p)return; let ex=panier.find(x=>x.code===code); if(ex) ex.qte++; else panier.push({code,qte:1,pv:p.pv,pa:p.pa||0,designation:p.designation}); renderPanier(); $('suggest').style.display='none'; $('searchProd').value=''; }
function renderPanier(){ let h=''; let total=0; panier.forEach((it,i)=>{ let sous=it.qte*it.pv; total+=sous; h+=`<div class="panierItem"><span>${it.code} x${it.qte}</span><span>${sous}Fc <button onclick="panier.splice(${i},1);renderPanier()">❌</button></span></div>`}); $('panier').innerHTML=h; let rem=parseFloat($('remise').value)||0; if(rem>5){alert('Max 5%'); $('remise').value=5; rem=5;} total=total*(1-rem/100); $('totalPanier').textContent=total.toFixed(0)+' Fc'; }
$('remise').addEventListener('input',renderPanier);
async function validerVente(){ if(!panier.length){alert('Panier vide');return;} let remise=parseFloat($('remise').value)||0; let tel=$('telClient').value.trim(); let nom=$('nomClient').value.trim(); let total=0; panier.forEach(it=>total+=it.qte*it.pv); total=total*(1-remise/100); let vente={shop:curShop,items:panier,remise,tel,nomClient:nom,total,date:Date.now(),jour:new Date().toISOString().slice(0,10)}; await db.ref('ventes/'+curShop).push(vente); for(let it of panier){ let q=(stockData[it.code]?.qte||0)-it.qte; await db.ref('stocks/'+curShop+'/'+it.code+'/qte').set(q); } panier=[]; renderPanier(); $('telClient').value=''; $('nomClient').value=''; $('remise').value=''; alert('Vente OK '+total+'Fc vers '+curShop); }
function calcCAJour(){ let today=new Date().toISOString().slice(0,10); db.ref('ventes/'+curShop).orderByChild('jour').equalTo(today).on('value',snap=>{ let tot=0; snap.forEach(c=>{tot+=c.val().total||0}); $('caJour').textContent='CA Jour: '+tot+' Fc'; let list=''; let synth={}; snap.forEach(c=>{let v=c.val(); v.items.forEach(it=>{synth[it.code]=(synth[it.code]||0)+it.qte}); list+=`<div class="panierItem"><span>${v.nomClient||'Client'} ${v.total}Fc</span><small>${new Date(v.date).toLocaleTimeString()}</small></div>`}); $('caisseList').innerHTML=list; $('caisseTotal').textContent=tot+' Fc'; let sH=''; Object.keys(synth).forEach(k=>{sH+=`${k}: ${synth[k]}<br>`}); $('synth').innerHTML=sH||'Aucune vente'; }); }
$('shopSel').value=curShop; $('shopName').textContent=curShop; loadStock();
</script>
</body></html>
