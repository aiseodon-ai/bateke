<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BATEKE V4.1 - SUPERVISEUR</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyC-V7h2Uve6FUSY2sBo7Rq-a3O0Qbm0W0o",authDomain:"bateke-v4.firebaseapp.com",projectId:"bateke-v4"};
const db=getFirestore(initializeApp(cfg));
let currentShop="Menkao1"; let allStock=[];
window.changeShop=async()=>{currentShop=document.getElementById("shopSelect").value; loadStock();}
window.loadStock=async()=>{
  const snap=await getDocs(collection(db,"shops",currentShop,"stock")); allStock=[];
  let html=`<tr><th>Designation</th><th>Qté</th><th>Seuil(3)</th><th>Prix Vente</th><th>Action</th></tr>`;
  snap.forEach(d=>{const p={id:d.id,...d.data()}; allStock.push(p);
    const al=(p.quantite<= (p.seuil||3))?'style="background:#ef4444;color:white"':''; 
    html+=`<tr ${al}><td>${p.designation}</td><td>${p.quantite}</td><td>${p.seuil||3}</td><td>${p.prix_vente}</td><td><button onclick="editProd('${p.id}')">✏️ Modifier</button></td></tr>`;});
  document.getElementById("stockTable").innerHTML=html;
}
window.editProd=async(id)=>{
  const p=allStock.find(x=>x.id==id);
  const q=prompt("Nouvelle Quantité:",p.quantite); if(q===null) return;
  const s=prompt("Nouveau Seuil (défaut 3):",p.seuil||3);
  const v=prompt("Nouveau Prix Vente:",p.prix_vente);
  const d=prompt("Désignation:",p.designation);
  await updateDoc(doc(db,"shops",currentShop,"stock",id),{quantite:parseInt(q),seuil:parseInt(s)||3,prix_vente:parseFloat(v),designation:d});
  loadStock();
}
window.onload=()=>loadStock();
</script>
<style>body{font-family:Arial;background:#0f172a;color:white;padding:15px}h1{color:#38bdf8}table{width:100%;background:white;color:black;border-collapse:collapse}th,td{padding:8px;border:1px solid #ccc}button{padding:6px 10px;background:#38bdf8;border:none;border-radius:6px;font-weight:bold}</style>
</head>
<body>
<h1>🧑‍💼 BATEKE V4.1 - SUPERVISEUR - Seuil 3</h1>
<p>Tu peux modifier Qté / Seuil / Prix Vente. Tu ne vois PAS prix achat ni bénéfice.</p>
<select id="shopSelect" onchange="changeShop()"><option>Menkao1</option><option>Menkao2</option><option>Mbakana</option></select>
<table id="stockTable"></table>
</body></html>
