<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
</head><body style="font-family:Arial;padding:20px">
<h2>🛠️ RESTORE BATEKE V4 - SECURE UPDATE</h2>
<div id="log"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBOD42Ibg7tGVafz44cwCyI0CUjgAn5MNY",
  authDomain: "bateke-v4.firebaseapp.com",
  databaseURL: "https://bateke-v4-default-rtdb.firebaseio.com",
  projectId: "bateke-v4",
  storageBucket: "bateke-v4.firebasestorage.app",
  messagingSenderId: "321333206282",
  appId: "1:321333206282:web:6d1603446be3d195de6ef3"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

try {
  const appCheck = firebase.appCheck();
  appCheck.activate(new firebase.appCheck.ReCaptchaEnterpriseProvider('6Lf_U_QtAAAAAHpf_J8KwWnKBPAFQUBSYO41tx5o'), true);
  console.log("🛡️ App Check OK");
} catch(e){ console.warn(e); }

const db = firebase.database();
firebase.auth().signInAnonymously().catch(()=>{});

function log(t){ document.getElementById('log').innerHTML += "<p>"+t+"</p>"; }

async function RESTORE(){
  log("Connexion bateke-v4...");
  await new Promise(r=>setTimeout(r,1500));
  
  const shops = ["Menkao1","Menkao2","Bateke","Mbakana","Limete"];
  let updates = {};
  let count = 0;

  for(let shop of shops){
    const snap = await db.ref(`shops/${shop}`).once('value');
    if(!snap.exists()){
      log(`➕ Création ${shop} (n'existait plus)`);
      updates[`shops/${shop}/config/nom`] = shop;
      updates[`shops/${shop}/config/created`] = new Date().toISOString();
      updates[`shops/${shop}/config_entreprise/nom`] = shop;
      updates[`shops/${shop}/config_entreprise/slogan`] = "BATEKE V4";
      updates[`shops/${shop}/stock/init`] = {CODE:"INIT", Désignation:"Article test", Quantite:0};
      count++;
    } else {
      log(`✅ ${shop} existe déjà, on ne touche pas`);
    }
  }

  // Patron - uniquement dans /patrons
  updates[`patrons/PATRON-001/id`] = "PATRON-001";
  updates[`patrons/PATRON-001/role`] = "patron";
  updates[`patrons/PATRON-001/nom`] = "DG Patron";

  if(Object.keys(updates).length>0){
    await db.ref().update(updates); // UPDATE = sécurisé
    log(`<b style="color:green">✅ RESTAURATION TERMINÉE - ${count} shops recréés, 0 effacé</b>`);
    log(`<b>Ouvre maintenant ton index.html (Patron V4.9.25)</b>`);
  } else {
    log("Rien à faire, tout existe déjà");
  }
}
setTimeout(RESTORE, 2000);
</script></body></html>
