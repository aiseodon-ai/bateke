<h2 id="st">Connexion...</h2>
<script>
const config={apiKey:"AIzaSyBOD42Ibg7tGVafz44cwCyI0CUjgAn5MNY",authDomain:"bateke-v4.firebaseapp.com",databaseURL:"https://bateke-v4-default-rtdb.firebaseio.com",projectId:"bateke-v4",storageBucket:"bateke-v4.firebasestorage.app",messagingSenderId:"321333206282",appId:"1:321333206282:web:6d1603446be3d195de6ef3"};
firebase.initializeApp(config);
firebase.auth().signInAnonymously().then(async()=>{

 }

}).catch(e=>{document.getElementById('st').innerText="ERREUR: "+e.message});
