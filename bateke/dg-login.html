<!DOCTYPE html><html><head><meta charset="UTF-8"><title>DG ONLY</title></head><body style="background:#000;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh">
<div style="background:#111;padding:30px;border-radius:16px;border:2px solid #a855f7;max-width:350px;width:100%">
<h2>👑 DG SUPRÊME ONLY</h2>
<input id="email" placeholder="Email DG" style="width:100%;padding:10px;margin:5px 0">
<input id="pass" type="password" placeholder="Mot de passe" style="width:100%;padding:10px;margin:5px 0">
<button onclick="loginDG()" style="width:100%;padding:12px;background:#a855f7;color:#fff;border:none;border-radius:8px;font-weight:bold">ENTRER</button>
<p id="msg" style="color:red"></p>
</div> 
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyBOD42Ibg7tGVafz44cwCyI0CUjgAn5MNY",authDomain:"bateke-v4.firebaseapp.com",databaseURL:"https://bateke-v4-default-rtdb.firebaseio.com",projectId:"bateke-v4"};
firebase.initializeApp(firebaseConfig);
async function loginDG(){
  let email=document.getElementById('email').value.trim();
  let pass=document.getElementById('pass').value.trim();
  try{
    let cred=await firebase.auth().signInWithEmailAndPassword(email,pass);
    let snap=await firebase.database().ref('superadmins/'+cred.user.uid).once('value');
    if(snap.val()===true || email==='admin@bateke.com'){
      location.href='./superadmin-v7.html'; // ta page DG V7.5
    } else {
      document.getElementById('msg').innerText='Pas SuperAdmin';
      await firebase.auth().signOut();
    }
  }catch(e){ document.getElementById('msg').innerText=e.message; }
}
</script></body></html>
