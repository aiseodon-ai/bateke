<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BATEKE - SUPERADMIN DG V7.3 PIN VENDEURS</title><base href="/bateke/">
<style>
 body{background:#0a0a0a;color:#eee;font-family:Inter,system-ui;padding:20px}
 .card{background:#171717;border:1px solid #262626;border-radius:16px;padding:18px;margin-top:14px}
 .kpi{font-size:28px;font-weight:900;color:#a855f7}
 .ok{color:#22c55e} .bad{color:#ef4444} .warn{color:orange} .muted{color:#888;font-size:11px}
 table{width:100%;border-collapse:collapse;margin-top:10px} th,td{padding:10px;border-bottom:1px solid #262626;text-align:left;font-size:12px}
 button{background:#7c3aed;color:#fff;border:0;padding:8px 12px;border-radius:8px;font-weight:bold;cursor:pointer;margin:2px}
 .btn-g{background:#22c55e} .btn-r{background:#ef4444} .btn-o{background:#f59e0b} .btn-b{background:#3b82f6}
 .pin-badge{background:#222;border:1px solid #444;padding:2px 6px;border-radius:6px;margin:2px;display:inline-block;font-size:11px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head><body>
<h1>👑 SUPERADMIN V7.3 - PIN PATRONS + VENDEURS PAR BOUTIQUE</h1>
<div class="card"><button class="btn-b" onclick="scanGlobal()">🔄 Re-scanner</button> <span id="statusScan" class="muted"></span></div>

<div class="card"><h3>📅 Abonnements 15K - PAR BOUTIQUE</h3>
<table><thead><tr><th>Boutique</th><th>Patron</th><th>Expire</th><th>Jours</th><th>Statut</th><th>Actions</th></tr></thead><tbody id="tableAbo"></tbody></table>
</div>

<div class="card" style="border:2px solid #a855f7"><h3>🔑 Tableau PIN + VENDEURS - CHAQUE BOUTIQUE</h3>
<table><thead><tr><th>Patron ID</th><th>Boutique</th><th>PIN Patron</th><th>Vendeurs (PIN + Nom)</th><th>Statut Abo</th></tr></thead><tbody id="tablePin"></tbody></table>
</div>

<script>
const CODE_DG = "BATEKE2026";
if(prompt("🔑 Code DG:") !== CODE_DG){ location.href='/bateke/'; throw new Error("x"); }

const firebaseConfig = {
  apiKey: "AIzaSyBOD42Ibg7tGVafz44cwCyI0CUjgAn5MNY",
  authDomain: "bateke-v4.firebaseapp.com",
  databaseURL: "https://bateke-v4-default-rtdb.firebaseio.com",
  projectId: "bateke-v4",
  storageBucket: "bateke-v4.firebasestorage.app",
  messagingSenderId: "321333206282",
  appId: "1:321333206282:web:6d1603446be3d195de6ef3"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);

const DG_MAP = { "7832": ["Intendance","Menkao1","Menkao2","Mbakana"] };
firebase.auth().signInAnonymously().then(()=> scanGlobal());

function toTime(v){ if(!v) return 0; if(typeof v==='number') return v; if(typeof v==='string'){ if(/^\d{12,}$/.test(v)) return parseInt(v,10); let t=new Date(v).getTime(); return isNaN(t)?0:t; } return 0; }

function scanGlobal(){
 document.getElementById('statusScan').innerText='⏳ Scan shops + patrons + vendeurs...';
 Promise.all([
   firebase.database().ref('shops').once('value').then(s=>s.val()||{}),
   firebase.database().ref('patrons').once('value').then(s=>s.val()||{})
 ]).then(([shopsObj, patronsObj])=>{
  const shopNames = Object.keys(shopsObj||{}).filter(k=>k!=="shops");
  let rowsAbo='', rowsPin='';

  // --- Tableau Abonnements ---
  shopNames.forEach(name=>{
    const shop = shopsObj[name]||{};
    const tShop = toTime(shop.abonnements?.expire);
    const jours = tShop ? Math.ceil((tShop-Date.now())/86400000) : -9999;
    let statut = !tShop ? '<span class="bad">JAMAIS</span>' : jours<0 ? `<span class="bad">BLOQUÉ ${jours}j</span>` : `<span class="ok">ACTIF ${jours}j</span>`;
    let pid = shop.patronId || "-";
    for(const p in patronsObj){ if(patronsObj[p].boutiques && patronsObj[p].boutiques[name]) pid=p; if(DG_MAP[p]?.includes(name)) pid=p; }
    rowsAbo+=`<tr><td><b>${name}</b></td><td>${pid}</td><td>${tShop?new Date(tShop).toLocaleDateString():'—'}</td><td>${tShop?jours+'j':''}</td><td>${statut}</td><td><button class="btn-g" onclick="activer('${name}')">+30J</button><button class="btn-r" onclick="bloquer('${name}')">BLOQUER</button></td></tr>`;
  });
  document.getElementById('tableAbo').innerHTML = rowsAbo;

  // --- Tableau PIN PATRON + VENDEURS (CORRIGÉ) ---
  for(const pid in patronsObj){
    const p = patronsObj[pid];
    let boutiques = [];
    if(p.boutiques) boutiques = Object.keys(p.boutiques);
    else if(p.boutique) boutiques = [p.boutique];
    else if(DG_MAP[pid]) boutiques = DG_MAP[pid];
    
    if(boutiques.length===0){
      // patron sans boutique déclarée
      rowsPin+=`<tr><td>${pid}</td><td><span class="muted">—</span></td><td><b>${p.pin||p.PIN||pid}</b></td><td><span class="muted">Aucun vendeur</span></td><td>—</td></tr>`;
      continue;
    }

    boutiques.forEach(bName=>{
      const shop = shopsObj[bName] || {};
      const vendeurs = shop.vendeurs || {};
      let vendeursHtml = '';
      
      if(Object.keys(vendeurs).length===0){
        vendeursHtml = '<span class="muted">Aucun vendeur créé</span>';
      } else {
        Object.keys(vendeurs).forEach(vk=>{
          const v = vendeurs[vk];
          const vPin = v.pin || v.PIN || vk;
          const vNom = v.nom || v.name || '';
          const vStatut = v.actif===false ? '🔴' : '🟢';
          vendeursHtml += `<span class="pin-badge">${vStatut} ${vPin} - ${vNom}</span> `;
        });
      }
      
      const exp = toTime(p.boutiques?.[bName]?.expire || shop.abonnements?.expire || p.abonnement?.expire);
      const jours = exp ? Math.ceil((exp-Date.now())/86400000) : -9999;
      const statutAbo = !exp ? '<span class="bad">JAMAIS</span>' : jours>=0 ? `<span class="ok">${jours}j</span>` : `<span class="bad">BLOQUÉ</span>`;
      
      rowsPin+=`<tr>
        <td><b>${pid}</b>${pid==="7832"?' (DG)':''}</td>
        <td><b>${bName}</b></td>
        <td><span class="pin-badge" style="background:#7c3aed;color:#fff">👑 ${p.pin||p.PIN||pid}</span></td>
        <td>${vendeursHtml}</td>
        <td>${statutAbo}</td>
      </tr>`;
    });
  }

  document.getElementById('tablePin').innerHTML = rowsPin || '<tr><td colspan=5>Aucun patron</td></tr>';
  document.getElementById('statusScan').innerText='✅ Scan OK - '+shopNames.length+' boutiques, PIN vendeurs chargés';
 });
}

function activer(b){ const fin=Date.now()+30*86400000; const u={}; u[`shops/${b}/abonnements/expire`]=fin; u[`shops/${b}/abonnements/statut`]='actif'; u[`shops/${b}/patronId`]='7832'; u[`patrons/7832/boutiques/${b}/expire`]=fin; u[`patrons/7832/boutiques/${b}/statut`]='actif'; firebase.database().ref().update(u).then(()=>scanGlobal()); }
function bloquer(b){ const past=Date.now()-10*86400000; const u={}; u[`shops/${b}/abonnements/expire`]=past; u[`shops/${b}/abonnements/statut`]='bloqué'; u[`patrons/7832/boutiques/${b}/expire`]=past; firebase.database().ref().update(u).then(()=>scanGlobal()); }
</script>
</body></html>
