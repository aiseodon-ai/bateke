<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BATEKE - SUPERADMIN DG SUPRÊME V6.2</title>
<base href="/bateke/">
<style>
 body{background:#0a0a0a;color:#fff;font-family:Inter,sans-serif;padding:20px}
 .card{background:#171717;border:1px solid #262626;border-radius:16px;padding:20px;margin:10px 0}
 .kpi{font-size:28px;font-weight:900;color:#a855f7}
 button{background:#7c3aed;color:#fff;border:0;padding:10px 16px;border-radius:10px;font-weight:bold;cursor:pointer}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
<h1>👑 BATEKE SUPERADMIN DG SUPRÊME V6.2 - GLOBAL</h1>
<div id="loginBox" class="card">
  <h3>Entre PIN DG Suprême</h3>
  <input id="pinInput" type="password" placeholder="PIN" style="padding:10px;border-radius:8px">
  <button onclick="loginDG()">ENTRER</button>
</div>

<div id="dash" style="display:none">
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <div class="card"><div>Total Boutiques</div><div id="totalBoutiques" class="kpi">--</div></div>
    <div class="card"><div>CA Global Jour</div><div id="caGlobal" class="kpi">-- FC</div></div>
    <div class="card"><div>Patrons</div><div id="totalPatrons" class="kpi">--</div></div>
  </div>
  <div class="card"><h3>Boutiques</h3><div id="listeBoutiques"></div></div>
  <button onclick="location.href='index.html?role=patron'">← Retour Boutique Menkao1</button>
</div>

<script>
// --- FIREBASE CONFIG - PAS DE APPCHECK ICI ---
const firebaseConfig = {
  apiKey: "AIzaSyBOD42Ibg7tGVafz44cwCyI0CUjgAn5MNY",
  authDomain: "bateke-v4.firebaseapp.com",
  databaseURL: "https://bateke-v4-default-rtdb.firebaseio.com",
  projectId: "bateke-v4",
  storageBucket: "bateke-v4.firebasestorage.app",
  messagingSenderId: "321333206282",
  appId: "1:321333206282:web:6d1603446be3d195de6ef3"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();
firebase.auth().signInAnonymously();

const PIN_DG = "7832"; // Ton PIN SuperAdmin

function loginDG(){
  if(document.getElementById('pinInput').value === PIN_DG){
    localStorage.setItem('BATEKE_DG','true');
    document.getElementById('loginBox').style.display='none';
    document.getElementById('dash').style.display='block';
    loadGlobal();
  } else alert('PIN incorrect');
}
if(localStorage.getItem('BATEKE_DG')==='true'){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('dash').style.display='block';
  loadGlobal();
}

function loadGlobal(){
  db.ref('boutiques').on('value', snap=>{
    const data = snap.val()||{};
    const shops = Object.keys(data);
    document.getElementById('totalBoutiques').innerText = shops.length;
    let ca=0; let html='';
    shops.forEach(shop=>{
      const ventes = data[shop]?.ventes || {};
      let caShop=0;
      Object.values(ventes).forEach(v=>{ if(v.date===new Date().toISOString().slice(0,10)) caShop+=(v.total||0) });
      ca+=caShop;
      html+=`<div style="padding:8px;border-bottom:1px solid #222">${shop} - ${caShop.toLocaleString()} FC</div>`;
    });
    document.getElementById('caGlobal').innerText = ca.toLocaleString() + ' FC';
    document.getElementById('listeBoutiques').innerHTML = html;
  });
  db.ref('patrons').on('value', snap=>{
    document.getElementById('totalPatrons').innerText = Object.keys(snap.val()||{}).length;
  });
}
console.log("✅ SUPERADMIN V6.2 STABLE - PAS DE REDIRECTION 404");
</script>
</body>
</html>
