<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BATEKE - SUPERADMIN V8.0 SAAS</title><base href="/bateke/">
<style>
 body{background:#0a0a0a;color:#eee;font-family:Inter,system-ui;padding:16px}
 .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
 .card{background:#171717;border:1px solid #262626;border-radius:16px;padding:18px;margin-top:14px}
 .kpi{font-size:28px;font-weight:900;color:#a855f7}
 .ok{color:#22c55e} .bad{color:#ef4444} .warn{color:#f59e0b} .muted{color:#888;font-size:11px}
 table{width:100%;border-collapse:collapse;margin-top:10px} th,td{padding:10px;border-bottom:1px solid #262626;text-align:left;font-size:12px;vertical-align:top}
 button{background:#7c3aed;color:#fff;border:0;padding:8px 12px;border-radius:8px;font-weight:bold;cursor:pointer;margin:2px;font-size:12px}
 .btn-g{background:#22c55e} .btn-r{background:#ef4444} .btn-o{background:#f59e0b} .btn-b{background:#3b82f6} .btn-dark{background:#262626;border:1px solid #444}
 input,select{padding:10px;border-radius:8px;border:1px solid #444;background:#0a0a0a;color:#fff;box-sizing:border-box;width:100%}
 .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:99999}
 .modal-box{background:#171717;border:1px solid #333;border-radius:16px;padding:20px;max-width:500px;width:90%;max-height:85vh;overflow:auto}
 .tabs{display:flex;gap:8px;margin-bottom:12px} .tab{padding:8px 14px;border-radius:20px;cursor:pointer;background:#222;border:1px solid #333} .tab.active{background:#7c3aed}
 .ca-blur{filter:blur(6px);cursor:pointer;user-select:none} .ca-blur:hover{filter:blur(0)}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head><body>
<h1>👑 BATEKE SUPERADMIN V8.0 SAAS</h1>

<div class="grid">
 <div class="card"><div>Boutiques</div><div id="totalBoutiques" class="kpi">...</div></div>
 <div class="card"><div>CA Jour Global (privé)</div><div id="caGlobal" class="kpi ca-blur" onclick="revealCA(this)">•••• FC</div><small class="muted">Clique pour voir - loggé</small></div>
 <div class="card"><div>Patrons</div><div id="totalPatrons" class="kpi">...</div></div>
 <div class="card"><div>Actifs / Bloqués</div><div id="abos" class="kpi">...</div><div id="abosDetail" class="muted"></div></div>
</div>

<div class="card">
<div class="tabs">
  <div class="tab active" onclick="switchTab('clients')">👥 Clients</div>
  <div class="tab" onclick="switchTab('boutiques')">🏪 Boutiques / Abos</div>
  <div class="tab" onclick="switchTab('create')">➕ Nouveau Client</div>
</div>

<!-- TAB CLIENTS -->
<div id="tab-clients">
  <input id="searchClient" placeholder="🔍 Chercher nom, téléphone, boutique, PIN..." oninput="scanGlobal()" style="margin-bottom:10px">
  <table><thead><tr><th>Client</th><th>Contact</th><th>Boutiques</th><th>PINs</th><th>Statut</th><th>Actions DG</th></tr></thead><tbody id="tableClients"></tbody></table>
</div>

<!-- TAB BOUTIQUES -->
<div id="tab-boutiques" style="display:none">
  <table><thead><tr><th>Boutique</th><th>Patron</th><th>Expire</th><th>Statut</th><th>Actions</th></tr></thead><tbody id="tableAbo"></tbody></table>
</div>

<!-- TAB CREATE -->
<div id="tab-create" style="display:none">
  <h3>➕ Nouveau Client SAAS</h3>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <input id="newPatronId" placeholder="ID PIN (ex: 1234)" type="number">
    <input id="newPatronPin" placeholder="PIN connexion (vide = même que ID)" type="number">
    <input id="newPatronNom" placeholder="Nom complet *">
    <input id="newPatronPhone" placeholder="Téléphone WhatsApp *">
    <input id="newPatronEmail" placeholder="Email (optionnel)">
    <input id="newBoutiqueNom" placeholder="Nom 1ère boutique *">
  </div>
  <input id="newPatronAdresse" placeholder="Adresse / Commune" style="margin-top:8px">
  <button class="btn-g" style="width:100%;margin-top:10px;padding:14px" onclick="creerPatron()">✅ CRÉER CLIENT BLOQUÉ</button>
  <div id="msgCreate" class="muted"></div>
</div>
</div>

<!-- MODAL FICHE CLIENT -->
<div id="modalClient" class="modal" onclick="if(event.target==this)closeModal()">
  <div class="modal-box">
    <h2 id="modalTitle">Fiche Client</h2>
    <div id="modalBody"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn-b" onclick="editClient()">✏️ Editer</button>
      <button class="btn-r" onclick="supprimerClient()">🗑️ Supprimer</button>
      <button class="btn-dark" onclick="closeModal()">Fermer</button>
    </div>
  </div>
</div>

<script>
const CODE_DG = "BATEKE2026";
if(prompt("🔑 Code DG:") !== CODE_DG){ location.href='/bateke/'; throw new Error("x"); }
const firebaseConfig = { apiKey:"AIzaSyBOD42Ibg7tGVafz44cwCyI0CUjgAn5MNY", authDomain:"bateke-v4.firebaseapp.com", databaseURL:"https://bateke-v4-default-rtdb.firebaseio.com", projectId:"bateke-v4", storageBucket:"bateke-v4.firebasestorage.app", messagingSenderId:"321333206282", appId:"1:321333206282:web:6d1603446be3d195de6ef3" };
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
let G_SHOPS={}, G_PATRONS={}, G_CURRENT_PID=null, G_CA=0;
firebase.auth().signInAnonymously().then(()=>scanGlobal());

function switchTab(t){ document.querySelectorAll('[id^="tab-"]').forEach(e=>e.style.display='none'); document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active')); document.getElementById('tab-'+t).style.display='block'; event.target.classList.add('active'); if(t!=='create') scanGlobal(); }
function toTime(v){ if(!v) return 0; if(typeof v==='number') return v; if(typeof v==='string' && /^\d{12,}$/.test(v)) return parseInt(v,10); let d=new Date(v).getTime(); return isNaN(d)?0:d; }
function trouverPatronDeShop(s, patrons){ for(let pid in patrons){ let p=patrons[pid]; if(p.boutiques && p.boutiques[s]) return pid; if((p.boutique||'').toLowerCase()===s.toLowerCase()) return pid; } return null; }
function revealCA(el){ if(!confirm('Voir CA global? Cette action est loggée.')) return; el.innerText=G_CA.toLocaleString()+' FC'; el.classList.remove('ca-blur'); firebase.database().ref('logs_support/'+Date.now()).set({action:'view_ca_global', ca:G_CA, ts:Date.now()}); }
function viewAsPatron(shop, pid){ sessionStorage.setItem('DG_SUPPORT_MODE','1'); sessionStorage.setItem('DG_SUPPORT_SHOP',shop); sessionStorage.setItem('DG_SUPPORT_PID',pid); window.open(`../?support=${encodeURIComponent(shop)}&pid=${encodeURIComponent(pid)}`, '_blank'); }

function scanGlobal(){
 const q=(document.getElementById('searchClient')?.value||'').toLowerCase();
 firebase.database().ref().once('value').then(snap=>{
  let all=snap.val()||{}; G_SHOPS=all.shops||{}; G_PATRONS=all.patrons||{};
  let shopNames=Object.keys(G_SHOPS).filter(k=>!['shops','Mbata','Itendance'].includes(k));
  let ca=0, actifs=0, bloques=0;
  shopNames.forEach(n=>{
   let shop=G_SHOPS[n]||{}; let today=new Date().toISOString().slice(0,10); Object.values(shop.ventes||{}).forEach(v=>{ if((v.date||'').slice(0,10)===today) ca+=Number(v.total||0); });
   let exp=toTime(shop.abonnements?.expire); if(exp && exp>Date.now()) actifs++; else bloques++;
  });
  G_CA=ca; document.getElementById('totalBoutiques').innerText=shopNames.length; document.getElementById('totalPatrons').innerText=Object.keys(G_PATRONS).length; document.getElementById('abos').innerText=`${actifs} / ${bloques}`; document.getElementById('abosDetail').innerText=`Actifs:${actifs} Bloqués:${bloques}`;
  // TABLE CLIENTS COMPLET
  let htmlClients='';
  Object.entries(G_PATRONS).forEach(([pid,p])=>{
   let boutiques=p.boutiques?Object.keys(p.boutiques):(p.boutique?[p.boutique]:[]);
   let searchStr=`${pid} ${p.nom||''} ${p.phone||''} ${p.email||''} ${boutiques.join(' ')}`.toLowerCase();
   if(q && !searchStr.includes(q)) return;
   let statut= boutiques.some(b=>{ let exp=toTime(p.boutiques?.[b]?.expire||G_SHOPS[b]?.abonnements?.expire); return exp>Date.now(); })?'<span class="ok">ACTIF</span>':'<span class="bad">BLOQUÉ</span>';
   htmlClients+=`<tr>
    <td><b>${p.nom||'—'}</b><br><span class="muted">ID:${pid} - PIN:${p.pin||pid}</span></td>
    <td>${p.phone?`<a href="https://wa.me/${p.phone.replace(/[^0-9]/g,'')}" target="_blank" style="color:#25D366">📱 ${p.phone}</a><br>`:''}${p.email||''}<br><span class="muted">${p.adresse||''}</span></td>
    <td>${boutiques.map(b=>`<span class="muted">${b}</span>`).join('<br>')||'—'}</td>
    <td><span style="background:#7c3aed;padding:2px 6px;border-radius:10px">👑 ${p.pin||pid}</span><br><small>${Object.keys(G_SHOPS[boutiques[0]]?.vendeurs||{}).length} vendeurs</small></td>
    <td>${statut}</td>
    <td>
      <button class="btn-b" onclick="openClient('${pid}')">👁️ Fiche</button>
      <button class="btn-dark" onclick="viewAsPatron('${boutiques[0]||''}','${pid}')">👁️ Voir</button>
      <button class="btn-o" onclick="resetPin('${pid}')">🔑 Reset</button>
      <button class="btn-r" onclick="supprimerClient('${pid}')">🗑️</button>
    </td></tr>`;
  });
  document.getElementById('tableClients').innerHTML=htmlClients||'<tr><td colspan=6>Aucun client</td></tr>';
  // TABLE ABOS
  let htmlAbo='';
  shopNames.forEach(name=>{
   let shop=G_SHOPS[name]||{}; let pid=shop.patronId||trouverPatronDeShop(name,G_PATRONS)||'—'; let exp=toTime(shop.abonnements?.expire); let jours=exp?Math.ceil((exp-Date.now())/86400000):-999; let statut=!exp?'<span class="bad">JAMAIS</span>':jours<0?`<span class="bad">BLOQUÉ ${jours}j</span>`:`<span class="ok">${jours}j</span>`; let aff=exp?new Date(exp).toLocaleDateString():'—';
   htmlAbo+=`<tr><td><b>${name}</b></td><td>${pid}</td><td>${aff}</td><td>${statut}</td><td><button class="btn-g" onclick="activer('${name}')">+30J</button> <button class="btn-r" onclick="bloquer('${name}')">BLOQUER</button> <button class="btn-dark" onclick="viewAsPatron('${name}','${pid}')">👁️</button></td></tr>`;
  });
  document.getElementById('tableAbo').innerHTML=htmlAbo;
 });
}

function openClient(pid){
 G_CURRENT_PID=pid; let p=G_PATRONS[pid]; let boutiques=p.boutiques?Object.keys(p.boutiques):(p.boutique?[p.boutique]:[]);
 document.getElementById('modalTitle').innerText=`${p.nom} - ${pid}`;
 document.getElementById('modalBody').innerHTML=`
  <p><b>ID:</b> ${pid}<br><b>PIN:</b> ${p.pin||pid}<br><b>Nom:</b> ${p.nom||''}<br><b>Tél:</b> ${p.phone||''} <a href="https://wa.me/${(p.phone||'').replace(/[^0-9]/g,'')}" target="_blank">WhatsApp</a><br><b>Email:</b> ${p.email||''}<br><b>Adresse:</b> ${p.adresse||''}<br><b>Créé:</b> ${p.created?new Date(p.created).toLocaleString():'—'}</p>
  <p><b>Boutiques (${boutiques.length}):</b><br>${boutiques.map(b=>{ let exp=toTime(p.boutiques?.[b]?.expire||G_SHOPS[b]?.abonnements?.expire); return `- ${b} : ${exp?new Date(exp).toLocaleDateString():'JAMAIS'} (${exp>Date.now()?'ACTIF':'BLOQUÉ'})`; }).join('<br>')||'—'}</p>
  <p><b>Vendeurs:</b><br>${boutiques.map(b=>Object.keys(G_SHOPS[b]?.vendeurs||{}).map(k=>G_SHOPS[b].vendeurs[k].nom||k).join(', ')).join('<br>')||'—'}</p>`;
 document.getElementById('modalClient').style.display='flex';
}
function closeModal(){ document.getElementById('modalClient').style.display='none'; }
function editClient(){
 let p=G_PATRONS[G_CURRENT_PID]; let nom=prompt('Nom:',p.nom||''); if(nom===null) return; let phone=prompt('Téléphone:',p.phone||''); let email=prompt('Email:',p.email||''); let adr=prompt('Adresse:',p.adresse||'');
 firebase.database().ref(`patrons/${G_CURRENT_PID}`).update({nom,phone,email,adresse:adr}).then(()=>{ alert('✅ Modifié'); closeModal(); scanGlobal(); });
}
function supprimerClient(pidArg){
 let pid=pidArg||G_CURRENT_PID; if(!pid) return; let p=G_PATRONS[pid]; let boutiques=p.boutiques?Object.keys(p.boutiques):(p.boutique?[p.boutique]:[]);
 if(!confirm(`⚠️ SUPPRIMER CLIENT ${pid} - ${p.nom||''} ?\nBoutiques: ${boutiques.join(', ')}\n\nCette action est irréversible!`)) return;
 if(!confirm(`DERNIERE CONFIRMATION: Supprimer définitivement ${p.nom}? Tape OK pour confirmer.`)) return;
 let updates={}; updates[`patrons/${pid}`]=null;
 // Supprime shops uniquement si ce patron est le seul propriétaire
 boutiques.forEach(b=>{ let otherOwner=Object.entries(G_PATRONS).some(([otherPid,otherP])=>otherPid!==pid && (otherP.boutiques?.[b] || otherP.boutique===b)); if(!otherOwner) updates[`shops/${b}`]=null; });
 firebase.database().ref().update(updates).then(()=>{ alert(`✅ Client ${pid} supprimé. Shops supprimés: ${boutiques.filter(b=>updates[`shops/${b}`]===null).join(', ')||'aucun (partagés)'}`); closeModal(); scanGlobal(); });
}
function resetPin(pid){ let newPin=prompt(`Nouveau PIN pour ${pid} (actuel ${G_PATRONS[pid].pin||pid}):`,G_PATRONS[pid].pin||pid); if(!newPin) return; firebase.database().ref(`patrons/${pid}/pin`).set(newPin).then(()=>{ alert('✅ PIN reset'); scanGlobal(); }); }
function creerPatron(){
 let pinId=document.getElementById('newPatronId').value.trim(); let nom=document.getElementById('newPatronNom').value.trim(); let boutique=document.getElementById('newBoutiqueNom').value.trim().replace(/[^a-zA-Z0-9]/g,''); let pinConn=document.getElementById('newPatronPin').value.trim()||pinId; let phone=document.getElementById('newPatronPhone').value.trim(); let email=document.getElementById('newPatronEmail').value.trim(); let adr=document.getElementById('newPatronAdresse').value.trim();
 if(!pinId||!nom||!boutique||!phone){ alert('Nom, ID, Boutique, Téléphone requis'); return; }
 let u={}; u[`patrons/${pinId}/pin`]=pinConn; u[`patrons/${pinId}/nom`]=nom; u[`patrons/${pinId}/phone`]=phone; u[`patrons/${pinId}/email`]=email; u[`patrons/${pinId}/adresse`]=adr; u[`patrons/${pinId}/boutique`]=boutique; u[`patrons/${pinId}/created`]=Date.now(); u[`patrons/${pinId}/boutiques/${boutique}/statut`]='bloqué'; u[`patrons/${pinId}/boutiques/${boutique}/expire`]=0; u[`shops/${boutique}/patronId`]=pinId; u[`shops/${boutique}/abonnements/expire`]=0; u[`shops/${boutique}/created`]=Date.now();
 firebase.database().ref().update(u).then(()=>{ document.getElementById('msgCreate').innerHTML='<span class="ok">✅ Client créé bloqué</span>'; scanGlobal(); switchTab('clients'); });
}
function activer(b){ firebase.database().ref(`shops/${b}/patronId`).once('value').then(s=>{ let pid=s.val()||trouverPatronDeShop(b,G_PATRONS)||'7832'; let fin=Date.now()+30*86400000; let up={}; up[`shops/${b}/abonnements/expire`]=fin; up[`patrons/${pid}/boutiques/${b}/expire`]=fin; up[`shops/${b}/abonnements/statut`]=up[`patrons/${pid}/boutiques/${b}/statut`]='actif'; firebase.database().ref().update(up).then(()=>scanGlobal()); }); }
function bloquer(b){ firebase.database().ref(`shops/${b}/patronId`).once('value').then(s=>{ let pid=s.val()||'7832'; let past=Date.now()-10*86400000; let up={}; up[`shops/${b}/abonnements/expire`]=past; up[`patrons/${pid}/boutiques/${b}/expire`]=past; up[`shops/${b}/abonnements/statut`]=up[`patrons/${pid}/boutiques/${b}/statut`]='bloqué'; firebase.database().ref().update(up).then(()=>scanGlobal()); }); }
</script>
</body></html>
