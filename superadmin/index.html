<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BATEKE - SUPERADMIN DG SUPRÊME V6.3 GLOBAL</title><base href="/bateke/">
<style>
 body{background:#0a0a0a;color:#eee;font-family:Inter,system-ui;padding:20px}
 .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
 .card{background:#171717;border:1px solid #262626;border-radius:16px;padding:18px}
 .kpi{font-size:30px;font-weight:900;color:#a855f7;margin-top:6px}
 .ok{color:#22c55e} .muted{color:#888;font-size:12px}
 table{width:100%;border-collapse:collapse;margin-top:10px} th,td{padding:10px;border-bottom:1px solid #262626;text-align:left;font-size:13px}
 button{background:#7c3aed;color:#fff;border:0;padding:10px 16px;border-radius:10px;font-weight:bold;cursor:pointer}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head><body>
<h1>👑 BATEKE SUPERADMIN DG SUPRÊME V6.3 - GLOBAL</h1>
<div class="grid">
 <div class="card"><div>Total Boutiques (6)</div><div id="totalBoutiques" class="kpi">...</div><div id="detailBoutiques" class="muted"></div></div>
 <div class="card"><div>CA Global Toutes boutiques (Jour)</div><div id="caGlobal" class="kpi">...</div></div>
 <div class="card"><div>Total Patrons</div><div id="totalPatrons" class="kpi">...</div></div>
 <div class="card"><div>Abonnements Actifs</div><div id="abos" class="kpi">...</div></div>
</div>

<div class="card" style="margin-top:14px"><h3>Tableau de tous les PIN</h3>
<table><thead><tr><th>Patron / Boutique</th><th>PIN</th><th>Statut</th><th>Shop</th></tr></thead><tbody id="tablePin"></tbody></table>
</div>
<div class="card"><h3>Boutiques Détectées</h3><div id="listeBoutiques"></div><div class="muted" id="debugPaths" style="margin-top:10px"></div></div>
<button onclick="location.href='index.html?role=patron'">← Retour Menkao1</button>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBOD42Ibg7tGVafz44cwCyI0CUjgAn5MNY",
  authDomain: "bateke-v4.firebaseapp.com",
  databaseURL: "https://bateke-v4-default-rtdb.firebaseio.com",
  projectId: "bateke-v4",
  storageBucket: "bateke-v4.firebasestorage.app",
  messagingSenderId: "321333206282",
  appId: "1:321333206282:web:6d1603446be3d195de6ef3"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
firebase.auth().signInAnonymously().then(()=>{ scanGlobal(); });

function scanGlobal(){
 const db = firebase.database();
 db.ref('/').once('value').then(snap=>{
  const root = snap.val()||{};
  console.log("ROOT KEYS:", Object.keys(root));
  document.getElementById('debugPaths').innerText = "Chemins trouvés dans Firebase: " + Object.keys(root).join(", ");

  // 1. TROUVER BOUTIQUES - essaie tous les chemins possibles
  let shopsObj = root.boutiques || root.shops || root.magasins || root.stores || root.bateke_boutiques || null;
  // Si pas trouvé, cherche les noeuds qui ressemblent à une boutique (qui ont ventes/stock)
  if(!shopsObj){
    shopsObj = {};
    for(const k in root){
      if(root[k] && typeof root[k]==='object' && (root[k].ventes || root[k].stock || root[k].produits)){
        shopsObj[k]=root[k];
      }
    }
  }
  const shopNames = Object.keys(shopsObj||{});
  document.getElementById('totalBoutiques').innerHTML = shopNames.length + (shopNames.length===6? ' <span class="ok">✅</span>':'');
  document.getElementById('detailBoutiques').innerText = shopNames.join(", ");

  let caGlobal=0; let htmlList='';
  shopNames.forEach(name=>{
    const shop = shopsObj[name]||{};
    const ventes = shop.ventes || {};
    let caShop=0;
    const today = new Date().toISOString().slice(0,10);
    Object.values(ventes).forEach(v=>{
      if(!v) return;
      const d = (v.date||'').slice(0,10);
      if(d===today || !v.date) caShop += (Number(v.total)||Number(v.montant)||0);
    });
    caGlobal+=caShop;
    htmlList+=`<div style="padding:8px;border-bottom:1px solid #222;display:flex;justify-content:space-between"><span>${name}</span><b>${caShop.toLocaleString()} FC</b></div>`;
  });
  document.getElementById('caGlobal').innerText = caGlobal.toLocaleString() + ' FC';
  document.getElementById('listeBoutiques').innerHTML = htmlList || '<span class="muted">Aucune vente aujourd\'hui</span>';

  // 2. PATRONS
  const patronsObj = root.patrons || root.users || root.comptes || {};
  document.getElementById('totalPatrons').innerText = Object.keys(patronsObj).length;

  // 3. ABONNEMENTS
  const abosObj = root.abonnements || root.abos || root.subscriptions || root.licences || {};
  const abosActifs = Object.values(abosObj).filter(a=>a && (a.actif!==false && a.statut!=='expiré')).length;
  document.getElementById('abos').innerText = abosActifs || Object.keys(abosObj).length;

  // 4. TABLEAU PIN
  let rows='';
  for(const id in patronsObj){
    const p = patronsObj[id];
    rows+=`<tr><td>${p.nom||p.name||id}</td><td><b style="letter-spacing:2px">${p.pin||p.PIN||p.code||'--'}</b></td><td>${p.statut||p.status||'actif'}</td><td>${p.boutique||p.shop||''}</td></tr>`;
  }
  // aussi cherche PIN dans shops
  shopNames.forEach(name=>{
    const s = shopsObj[name];
    if(s && s.pin) rows+=`<tr><td>${name} (shop)</td><td><b>${s.pin}</b></td><td>shop-pin</td><td>${name}</td></tr>`;
  });
  document.getElementById('tablePin').innerHTML = rows || '<tr><td colspan=4 class="muted">Aucun PIN trouvé - vérifie /patrons</td></tr>';

  console.log("✅ GLOBAL OK", {shops:shopNames.length, ca:caGlobal, patrons:Object.keys(patronsObj).length});
 }).catch(e=>{ console.error(e); document.getElementById('debugPaths').innerText='Erreur Firebase: '+e.message});
}
</script><div class="card" style="border:1px solid #22c55e"><h3>💰 Paiements 15.000 FC en attente</h3><div id="paiements"></div></div>
<script>
firebase.database().ref('paiements_abonnements').on('value',snap=>{
 const data=snap.val()||{}; let h='';
 Object.keys(data).forEach(k=>{
  const p=data[k]; if(p.statut!=='en_attente') return;
  h+=`<div style="padding:10px;border-bottom:1px solid #222;display:flex;justify-content:space-between"><div><b>${p.boutique}</b> - ${p.reseau} ${p.transactionId}<br><small>${p.phonePayer} → ${p.numeroDG} - ${p.montant}FC</small></div><button onclick="activer('${p.boutique}','${k}')">ACTIVER 30J</button></div>`;
 }); document.getElementById('paiements').innerHTML=h||'<span class="muted">Aucun paiement en attente</span>';
});
function activer(boutique,key){
 const debut = new Date();
 const fin = new Date(); 
 fin.setDate(fin.getDate()+30);
 fin.setHours(23,59,59,999);

 const debutISO = debut.toISOString();
 const finISO = fin.toISOString();
 const finSimple = fin.toISOString().slice(0,10); // 2026-11-25

 // FORMAT IMAGE (celui que tu as dans ton screenshot)
 firebase.database().ref('patrons/'+boutique+'/abonnement').update({
   debut: debutISO,
   expire: finISO,
   statut: "actif",
   plan: "enterprise"
 });

 // FORMAT COMPATIBILITE pour l'ancien code qui cherche abonnement_fin
 firebase.database().ref('patrons/'+boutique).update({
   abonnement_fin: finSimple,
   abonnement_debut: debutISO.slice(0,10),
   statut: "actif",
   actif: true,
   isAdmin: true
 });

 // Valider paiement
 firebase.database().ref('paiements_abonnements/'+key).update({
   statut: "valide",
   valide_le: debutISO
 });

 alert('✅ '+boutique+' activé du '+debut.toLocaleDateString()+' au '+fin.toLocaleDateString());
 location.reload();
}
</script></body></html>
