<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BATEKE V4.1 - VENDEUR FIX</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>body{background:#0f172a;color:white;font-family:Arial;padding:15px}h1{color:#22c55e}select,button{padding:10px;border-radius:8px;border:none;font-weight:bold}table{width:100%;background:white;color:black;border-collapse:collapse;margin-top:15px;border-radius:8px;overflow:hidden}th{background:#0f172a;color:white;padding:10px}td{padding:8px;text-align:center;border-bottom:1px solid #ddd}.rouge{background:#fecaca;font-weight:bold}.log{background:#000;color:#0f0;padding:8px;border-radius:6px;font-family:monospace;margin-top:10px}</style></head><body>
<h1>🛒 BATEKE V4.1 - VENDEUR FIX</h1>
<div>Magasin: <select id="magasin" onchange="charger()"><option value="mbakana">Mbakana</option><option value="menkao1">Menkao1</option><option value="menkao2">Menkao2</option></select> <span id="status">Chargement...</span></div>
<div id="log" class="log">Connexion Firebase bateke-v4...</div>
<table id="t"><thead><tr><th>Produit</th><th>Qté dispo</th><th>Seuil</th><th>Prix Vente</th><th>Vendre</th></tr></thead><tbody></tbody></table>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB0D421bg7tGVafz44cwCyIOCujgAn5MNY",
  authDomain: "bateke-v4.firebaseapp.com",
  databaseURL: "https://bateke-v4-default-rtdb.firebaseio.com",
  projectId: "bateke-v4",
  storageBucket: "bateke-v4.firebasestorage.app",
  messagingSenderId: "321333206282",
  appId: "1:321333206282:web:6d1603446be3d195de6ef3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
function log(t){document.getElementById('log').innerHTML+="<br>> "+t;}
function charger(){
  const mag = document.getElementById('magasin').value;
  document.getElementById('status').textContent="Chargement "+mag+"...";
  const tbody=document.querySelector('#t tbody'); tbody.innerHTML="<tr><td colspan=5>Chargement...</td></tr>";
  db.ref('magasins/'+mag+'/stock').once('value').then(snap=>{
    const data = snap.val();
    tbody.innerHTML="";
    if(!data){ tbody.innerHTML="<tr><td colspan=5>Aucun stock dans /magasins/"+mag+" - Importe d'abord dans PATRON</td></tr>"; log("VIDE pour "+mag); document.getElementById('status').textContent="Vide - 0 produits"; return; }
    const list = Object.values(data);
    log(mag+" : "+list.length+" produits trouvés");
    document.getElementById('status').textContent=list.length+" produits";
    list.forEach(p=>{
      const tr=document.createElement('tr'); if(p.quantite<=p.seuil) tr.className='rouge';
      tr.innerHTML=`<td>${p.designation}</td><td>${p.quantite}</td><td>${p.seuil}</td><td>${p.prix_vente} Fc</td><td><button onclick="vendre('${p.code}')" style="background:#22c55e;padding:8px 12px;border-radius:6px">Vendre -1</button></td>`;
      tbody.appendChild(tr);
    });
  }).catch(e=>{ log("Erreur Firebase: "+e.message); });
}
function vendre(code){
  const mag=document.getElementById('magasin').value;
  db.ref('magasins/'+mag+'/stock/'+code+'/quantite').transaction(q=>(q||0)-1);
  log("Vente "+code+" dans "+mag);
  setTimeout(charger,500);
}
window.onload=charger;
db.ref('magasins').on('value',()=>charger());
</script></body></html>
