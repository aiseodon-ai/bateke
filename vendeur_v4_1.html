<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BATEKE V4.1 - VENDEUR</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyC-V7h2Uve6FUSY2sBo7Rq-a3O0Qbm0W0o",authDomain:"bateke-v4.firebaseapp.com",projectId:"bateke-v4"};
const db=getFirestore(initializeApp(cfg));
let currentShop="Menkao1"; let allStock=[];
window.changeShop=async()=>{currentShop=document.getElementById("shopSelect").value; loadStock();}
window.loadStock=async()=>{
  const snap=await getDocs(collection(db,"shops",currentShop,"stock")); allStock=[];
  let html=`<tr><th>Produit</th><th>Qté dispo</th><th>Seuil</th><th>Prix Vente</th><th>Vendre</th></tr>`;
  snap.forEach(d=>{const p={id:d.id,...d.data()}; allStock.push(p);
    const al=(p.quantite<= (p.seuil||3))?'style="background:#fde68a"':''; 
    html+=`<tr ${al}><td>${p.designation}</td><td>${p.quantite}</td><td>${p.seuil||3}</td><td>${p.prix_vente} FC</td><td><button onclick="vendre('${p.id}')">🛒 Vendre</button></td></tr>`;});
  document.getElementById("stockTable").innerHTML=html;
}
window.vendre=async(id)=>{
  const p=allStock.find(x=>x.id==id); const q=parseInt(prompt("Quantité à vendre:",1)); if(!q||q>p.quantite){alert("Stock insuffisant");return;}
  await updateDoc(doc(db,"shops",currentShop,"stock",id),{quantite:p.quantite-q});
  await addDoc(collection(db,"shops",currentShop,"ventes"),{designation:p.designation,quantite:q,prix_vente:p.prix_vente,prix_achat:p.prix_achat||0,date:new Date(),boutique:currentShop});
  alert("Vendu!"); loadStock();
}
window.onload=()=>loadStock();
</script>
<style>body{font-family:Arial;background:#0f172a;color:white;padding:15px}h1{color:#22c55e}table{width:100%;background:white;color:black;border-collapse:collapse}th,td{padding:8px;border:1px solid #ccc}button{padding:6px 10px;background:#22c55e;border:none;border-radius:6px}</style>
</head>
<body>
<h1>🛍️ BATEKE V4.1 - VENDEUR</h1>
<select id="shopSelect" onchange="changeShop()"><option>Menkao1</option><option>Menkao2</option><option>Mbakana</option></select>
<table id="stockTable"></table>
</body></html>
