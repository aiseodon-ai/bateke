<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Patron Bateke</title><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f0f2f5}header{background:#111;color:white;padding:20px;text-align:center}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:15px}.stat{background:white;padding:15px;border-radius:12px;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,.1)}.stat b{font-size:20px;display:block;color:#0b5e2f}.section{background:white;margin:10px;border-radius:12px;padding:15px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}.btn{padding:6px 10px;border:none;border-radius:6px;font-weight:bold}.btn-green{background:#0b5e2f;color:white}</style></head><body><header><h2>📊 DASHBOARD PATRON V2</h2><small>Seul toi vois le bénéfice</small><div id="date"></div></header><div class="stats"><div class="stat"><b id="ca">0</b><small>CA Total</small></div><div class="stat"><b id="benef">0</b><small>Bénéfice (si achat rempli)</small></div><div class="stat"><b id="dette">0</b><small>Crédits clients</small></div><div class="stat"><b id="nb">0</b><small>Ventes</small></div></div><div class="section"><h3>Par Boutique</h3><div id="parBout"></div></div><div class="section"><h3>🚨 Qui te doit de l'argent</h3><table><thead><tr><th>Client</th><th>Tél</th><th>Dette</th><th>Action</th></tr></thead><tbody id="creditT"></tbody></table></div><div class="section"><h3>👥 Clients fidélité</h3><button class="btn btn-green" onclick="exportWA()">Exporter numéros WhatsApp</button><table><thead><tr><th>Nom</th><th>Tél</th><th>Achats totaux</th></tr></thead><tbody id="clientT"></tbody></table></div><div class="section"><h3>Dernières ventes</h3><table><thead><tr><th>Date</th><th>Boutique</th><th>Client</th><th>Total</th><th>Bénéf</th><th>Statut</th></tr></thead><tbody id="venteT"></tbody></table></div><script>function load(){let V=JSON.parse(localStorage.getItem('ventes_bateke_v2')||'[]');let C=JSON.parse(localStorage.getItem('clients_bateke_v2')||'[]');document.getElementById('date').innerText=new Date().toLocaleString('fr-FR');let ca=V.reduce((s,v)=>s+v.total,0);let benef=V.reduce((s,v)=>s+(v.benefice||0),0);let dette=V.reduce((s,v)=>s+v.dette,0);document.getElementById('ca').innerText=ca.toLocaleString()+' FC';document.getElementById('benef').innerText=benef.toLocaleString()+' FC';document.getElementById('dette').innerText=dette.toLocaleString()+' FC';document.getElementById('nb').innerText=V.length;let map={};V.forEach(v=>{map[v.boutique]=(map[v.boutique]||0)+v.total;});document.getElementById('parBout').innerHTML=Object.entries(map).map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:6px 0"><b>${k}</b><span>${v.toLocaleString()} FC</span></div>`).join('')||'Aucune vente';document.getElementById('creditT').innerHTML=C.filter(c=>c.dette>0).map(c=>`<tr><td>${c.nom}</td><td>${c.phone}</td><td style="color:red">${c.dette.toLocaleString()}</td><td><a href="https://wa.me/${c.phone}?text=Bonjour ${c.nom}, rappel dette ${c.dette} FC - Bateke" target="_blank"><button class="btn btn-green">WhatsApp</button></a></td></tr>`).join('')||'<tr><td colspan=4>Aucun crédit</td></tr>';document.getElementById('clientT').innerHTML=C.map(c=>`<tr><td>${c.nom}</td><td>${c.phone}</td><td>${c.achats.toLocaleString()}</td></tr>`).join('')||'<tr><td colspan=3>Aucun client</td></tr>';document.getElementById('venteT').innerHTML=V.slice(-50).reverse().map(v=>`<tr><td>${new Date(v.date).toLocaleDateString()}</td><td>${v.boutique}</td><td>${v.client.nom}</td><td>${v.total.toLocaleString()}</td><td>${(v.benefice||0).toLocaleString()}</td><td>${v.payement==='credit'?'Crédit':'Payé'}</td></tr>`).join('')||'<tr><td colspan=6>Aucune vente</td></tr>';}function exportWA(){let C=JSON.parse(localStorage.getItem('clients_bateke_v2')||'[]');let t=C.map(c=>c.phone).join('\n');let b=new Blob([t],{type:'text/plain'});let u=URL.createObjectURL(b);let a=document.createElement('a');a.href=u;a.download='clients_whatsapp.txt';a.click();}load();setInterval(load,3000);</script></body></html>
